name: Promote to Staging

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        required: true
        type: string

jobs:
  deploy-staging:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: stg
      image_ref: ${{ inputs.image_ref }}
    secrets: inherit
