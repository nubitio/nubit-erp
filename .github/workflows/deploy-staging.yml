name: Promote to Staging

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*-rc*'

permissions:
  contents: read

jobs:
  resolve-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
    steps:
      - name: Login to GHCR
        if: ${{ inputs.image_ref == '' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: ${{ inputs.image_ref == '' }}

      - name: Resolve image reference
        id: resolve
        env:
          INPUT_IMAGE_REF: ${{ inputs.image_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_REF:-}" ]; then
            echo "image_ref=${INPUT_IMAGE_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_TAG="ghcr.io/${REPOSITORY,,}:sha-${SHORT_SHA}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve digest for ${IMAGE_TAG}"
            exit 1
          fi

          IMAGE_REF="ghcr.io/${REPOSITORY,,}@${DIGEST}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${IMAGE_REF}"

  deploy-staging:
    needs: resolve-image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: stg
      # APP_URL is the required smoke target configured in the stg environment.
      image_ref: ${{ needs.resolve-image.outputs.image_ref }}
    secrets: inherit
