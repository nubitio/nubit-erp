name: Deploy to Staging

# Cada push a release/x.y.x despliega automáticamente a staging.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version/tag (defaults to sha)'
        required: false
        type: string
  push:
    branches:
      - 'release/*'

jobs:
  deploy-staging:
    name: Deploy to Staging
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: stg
      version: ${{ inputs.version || github.sha }}
    secrets: inherit
