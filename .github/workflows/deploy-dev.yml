name: Deploy to Dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-dev:
    needs: build-image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      # Manual recovery/preview deploys build the selected workflow ref.
      image_ref: ${{ needs.build-image.outputs.image_ref }}
    secrets: inherit
