name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge-dependabot:
    name: Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    timeout-minutes: 10

    steps:
      - name: Fetch PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            return pullRequest;

      - name: Check CI status
        id: ci-status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });
            
            // Use exact matching to prevent false positives
            const requiredChecks = [
              'CI Summary',
              'Security Summary'
            ];
            
            const checkStatuses = checks.check_runs
              .filter(check => requiredChecks.includes(check.name))
              .map(check => ({
                name: check.name,
                status: check.status,
                conclusion: check.conclusion
              }));
            
            // Ensure all required checks are present
            const foundChecks = checkStatuses.map(c => c.name);
            const missingChecks = requiredChecks.filter(req => !foundChecks.includes(req));
            
            if (missingChecks.length > 0) {
              core.warning(`Missing required checks: ${missingChecks.join(', ')}`);
              core.setOutput('all_passed', false);
              return { allPassed: false, checks: checkStatuses, missing: missingChecks };
            }
            
            const allPassed = checkStatuses.every(
              check => check.status === 'completed' && check.conclusion === 'success'
            );
            
            core.setOutput('all_passed', allPassed);
            
            if (!allPassed) {
              console.log('Not all checks passed:', checkStatuses);
            }
            
            return { allPassed, checks: checkStatuses };

      - name: Check if patch or minor update
        id: version-check
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          # Check if it's a patch or minor update
          if echo "$PR_TITLE" | grep -qE "(patch|minor|dependencies)"; then
            echo "is_safe=true" >> "$GITHUB_OUTPUT"
            echo "✅ Safe update type detected"
          else
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Major update detected - manual review required"
          fi

      - name: Approve PR
        if: |
          steps.ci-status.outputs.all_passed == 'true' &&
          steps.version-check.outputs.is_safe == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '✅ Auto-approved by CI workflow - all checks passed'
            });

      - name: Merge PR with status verification
        if: |
          steps.ci-status.outputs.all_passed == 'true' &&
          steps.version-check.outputs.is_safe == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Re-verify check status immediately before merge to prevent race condition
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });
            
            const requiredChecks = ['CI Summary', 'Security Summary'];
            const currentChecks = checks.check_runs.filter(check => 
              requiredChecks.includes(check.name)
            );
            
            // Verify all required checks are still present and passing
            const foundChecks = currentChecks.map(c => c.name);
            const missingChecks = requiredChecks.filter(req => !foundChecks.includes(req));
            
            if (missingChecks.length > 0) {
              core.setFailed(`Required checks missing: ${missingChecks.join(', ')}`);
              return;
            }
            
            const allPassed = currentChecks.every(
              check => check.status === 'completed' && check.conclusion === 'success'
            );
            
            if (!allPassed) {
              const failedChecks = currentChecks
                .filter(c => c.conclusion !== 'success')
                .map(c => `${c.name}: ${c.conclusion}`);
              core.setFailed(`Checks failed or changed since verification: ${failedChecks.join(', ')}`);
              return;
            }
            
            // All checks still passing, safe to merge
            console.log('✅ All checks verified immediately before merge');
            
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
              commit_title: `${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})`,
              commit_message: 'Auto-merged by dependabot workflow'
            });

      - name: Add comment
        if: |
          steps.ci-status.outputs.all_passed == 'true' &&
          steps.version-check.outputs.is_safe == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Auto-merged by CI workflow after all checks passed successfully.'
            });

  auto-merge-minor-prs:
    name: Auto-Merge Minor PRs
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      contains(github.event.pull_request.labels.*.name, 'type: chore')
    timeout-minutes: 10

    steps:
      - name: Check if PR is approved
        id: approval-check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const approvals = reviews.filter(
              review => review.state === 'APPROVED'
            );
            
            const isApproved = approvals.length > 0;
            core.setOutput('is_approved', isApproved);
            
            return { isApproved, approvals: approvals.length };

      - name: Check CI status
        id: ci-status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });
            
            // Use exact matching for required checks
            const requiredChecks = [
              'CI Summary',
              'Security Summary'
            ];
            
            const relevantChecks = checks.check_runs
              .filter(check => requiredChecks.includes(check.name));
            
            // Ensure all required checks are present
            const foundChecks = relevantChecks.map(c => c.name);
            const missingChecks = requiredChecks.filter(req => !foundChecks.includes(req));
            
            if (missingChecks.length > 0) {
              core.warning(`Missing required checks: ${missingChecks.join(', ')}`);
              core.setOutput('all_passed', false);
              return false;
            }
            
            const allPassed = relevantChecks
              .filter(check => check.status === 'completed')
              .every(check => check.conclusion === 'success');
            
            core.setOutput('all_passed', allPassed);
            return allPassed;

      - name: Merge PR with final verification
        if: |
          steps.approval-check.outputs.is_approved == 'true' &&
          steps.ci-status.outputs.all_passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Re-verify check status immediately before merge to prevent race condition
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });
            
            const requiredChecks = ['CI Summary', 'Security Summary'];
            const currentChecks = checks.check_runs.filter(check => 
              requiredChecks.includes(check.name)
            );
            
            // Verify all required checks are still present and passing
            const foundChecks = currentChecks.map(c => c.name);
            const missingChecks = requiredChecks.filter(req => !foundChecks.includes(req));
            
            if (missingChecks.length > 0) {
              core.setFailed(`Required checks missing at merge time: ${missingChecks.join(', ')}`);
              return;
            }
            
            const allPassed = currentChecks.every(
              check => check.status === 'completed' && check.conclusion === 'success'
            );
            
            if (!allPassed) {
              const failedChecks = currentChecks
                .filter(c => c.conclusion !== 'success')
                .map(c => `${c.name}: ${c.conclusion}`);
              core.setFailed(`Checks failed or changed since verification: ${failedChecks.join(', ')}`);
              return;
            }
            
            // All checks still passing, safe to merge
            console.log('✅ All checks re-verified immediately before merge');
            
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Auto-merged after approval and successful CI checks (verified at merge time).'
            });
