name: Workflow Dashboard

on:
  workflow_dispatch:
  schedule:
    # Generate dashboard daily at 8 AM UTC
    - cron: '0 8 * * *'

permissions:
  contents: write
  actions: read

jobs:
  generate-dashboard:
    name: Generate Workflow Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch workflow stats
        id: stats
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const stats = {};

            for (const workflow of workflows.data.workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 10
              });

              const recent = runs.data.workflow_runs.slice(0, 10);
              const successCount = recent.filter(r => r.conclusion === 'success').length;
              const failureCount = recent.filter(r => r.conclusion === 'failure').length;
              const successRate = recent.length > 0 ? (successCount / recent.length * 100).toFixed(1) : 0;

              stats[workflow.name] = {
                path: workflow.path,
                state: workflow.state,
                successRate,
                totalRuns: recent.length,
                lastRun: recent[0] || null
              };
            }

            return stats;

      - name: Generate dashboard markdown
        run: |
          cat > docs/WORKFLOW_DASHBOARD.md << EOF
          # 📊 Workflow Dashboard

          > Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## 🔄 Workflow Status Overview

          This dashboard provides a quick overview of all CI/CD workflows and their recent performance.

          ### Core Workflows

          | Workflow | Status | Success Rate (Last 10) | Last Run |
          |----------|--------|------------------------|----------|
          | CI | ![CI](https://github.com/${{ github.repository }}/actions/workflows/ci.yml/badge.svg) | - | - |
          | Deploy | ![Deploy](https://github.com/${{ github.repository }}/actions/workflows/deploy.yml/badge.svg) | - | - |
          | Security | ![Security](https://github.com/${{ github.repository }}/actions/workflows/security.yml/badge.svg) | - | - |
          | Versioning | ![Versioning](https://github.com/${{ github.repository }}/actions/workflows/versioning.yml/badge.svg) | - | - |

          ### Operational Workflows

          | Workflow | Status | Purpose |
          |----------|--------|---------|
          | Rollback | ![Rollback](https://github.com/${{ github.repository }}/actions/workflows/rollback.yml/badge.svg) | Emergency rollback |
          | Performance | ![Performance](https://github.com/${{ github.repository }}/actions/workflows/performance.yml/badge.svg) | Load testing |
          | Auto-Merge | ![Auto-Merge](https://github.com/${{ github.repository }}/actions/workflows/auto-merge.yml/badge.svg) | Automated merging |
          | PR Automation | ![PR Automation](https://github.com/${{ github.repository }}/actions/workflows/pr-automation.yml/badge.svg) | PR management |

          ## 📈 Recent Activity

          ### Last 7 Days

          - Total workflow runs: -
          - Success rate: -
          - Average duration: -
          - Most triggered workflow: -

          ## 🎯 Quality Metrics

          ### Test Coverage
          - Backend: -
          - Frontend: -

          ### Security
          - Last security scan: -
          - Critical vulnerabilities: 0
          - High vulnerabilities: 0

          ### Performance
          - Last performance test: -
          - Average response time: -
          - Error rate: -

          ## 🚀 Deployment History

          ### Staging
          - Last deployment: -
          - Version: -
          - Status: ✅

          ### Production
          - Last deployment: -
          - Version: -
          - Status: ✅

          ## 🔗 Quick Links

          - [View All Workflows](https://github.com/${{ github.repository }}/actions)
          - [Deployment History](https://github.com/${{ github.repository }}/deployments)
          - [Security Alerts](https://github.com/${{ github.repository }}/security)
          - [Workflow Documentation](.github/workflows/README.md)

          ---

          *This dashboard is automatically generated daily by the Dashboard workflow.*
          EOF

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p docs

          if git diff --quiet docs/WORKFLOW_DASHBOARD.md; then
            echo "No changes to dashboard"
          else
            git add docs/WORKFLOW_DASHBOARD.md
            git commit -m "docs: update workflow dashboard [skip ci]"
            git push
          fi
