name: Performance Testing

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      duration:
        description: 'Test duration (seconds)'
        required: false
        default: '60'
        type: string
      concurrent_users:
        description: 'Concurrent virtual users'
        required: false
        default: '10'
        type: string
  schedule:
    # Run performance tests weekly on staging
    - cron: '0 3 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: performance-${{ inputs.environment || 'scheduled' }}
  cancel-in-progress: false

jobs:
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create K6 test script
        run: |
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          const errorRate = new Rate('errors');

          // Parse duration from environment (in seconds)
          const testDuration = parseInt(__ENV.DURATION || '60');
          const vus = parseInt(__ENV.VUS || '10');

          // Calculate stage durations dynamically
          // Ramp-up: 20% of total time
          // Sustained: 60% of total time
          // Ramp-down: 20% of total time
          const rampUpTime = Math.floor(testDuration * 0.2);
          const sustainedTime = Math.floor(testDuration * 0.6);
          const rampDownTime = testDuration - rampUpTime - sustainedTime;

          export const options = {
            stages: [
              { duration: `${rampUpTime}s`, target: vus },     // Ramp up to target VUs
              { duration: `${sustainedTime}s`, target: vus },  // Stay at target VUs
              { duration: `${rampDownTime}s`, target: 0 },     // Ramp down to 0
            ],
            thresholds: {
              http_req_duration: ['p(95)<500', 'p(99)<1000'],
              http_req_failed: ['rate<0.05'],
              errors: ['rate<0.1'],
            },
          };

          export default function () {
            const BASE_URL = __ENV.BASE_URL || 'http://localhost';

            // Test homepage
            let res = http.get(`${BASE_URL}/`);
            let success = check(res, {
              'status is 200': (r) => r.status === 200,
              'response time < 500ms': (r) => r.timings.duration < 500,
            });

            errorRate.add(!success);

            sleep(1);
          }
          EOF

      - name: Run load test
        env:
          BASE_URL: ${{ secrets.APP_URL }}
          VUS: ${{ inputs.concurrent_users || '10' }}
          DURATION: ${{ inputs.duration || '60' }}
        run: |
          echo "🚀 Starting load test:"
          echo "  - Duration: ${DURATION}s"
          echo "  - Virtual Users: ${VUS}"
          echo "  - Target URL: ${BASE_URL}"
          k6 run --out json=results.json load-test.js || true

      - name: Parse results
        id: results
        run: |
          if [ -f results.json ]; then
            echo "## 📊 Performance Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Configuration" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment:** ${{ inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Duration:** ${{ inputs.duration || '60' }}s" >> $GITHUB_STEP_SUMMARY
            echo "- **Virtual Users:** ${{ inputs.concurrent_users || '10' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Target URL:** \`${{ secrets.APP_URL }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Calculate stage breakdown
            DURATION=${{ inputs.duration || '60' }}
            RAMP_UP=$((DURATION * 20 / 100))
            SUSTAINED=$((DURATION * 60 / 100))
            RAMP_DOWN=$((DURATION - RAMP_UP - SUSTAINED))

            echo "### Test Stages" >> $GITHUB_STEP_SUMMARY
            echo "1. **Ramp-up:** ${RAMP_UP}s (0 → ${{ inputs.concurrent_users || '10' }} VUs)" >> $GITHUB_STEP_SUMMARY
            echo "2. **Sustained Load:** ${SUSTAINED}s (${{ inputs.concurrent_users || '10' }} VUs)" >> $GITHUB_STEP_SUMMARY
            echo "3. **Ramp-down:** ${RAMP_DOWN}s (${{ inputs.concurrent_users || '10' }} → 0 VUs)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Results" >> $GITHUB_STEP_SUMMARY
            echo "Detailed results saved to artifact. Check the JSON file for complete metrics." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results-${{ github.run_number }}
          path: results.json
          retention-days: 90

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ secrets.APP_URL }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Lighthouse summary
        run: |
          echo "## 🏠 Lighthouse Audit" >> $GITHUB_STEP_SUMMARY
          echo "Lighthouse audit completed. Check artifacts for detailed report." >> $GITHUB_STEP_SUMMARY

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [load-test, lighthouse-audit]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## 📈 Performance Testing Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Load Testing | ${{ needs.load-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${{ needs.lighthouse-audit.result }} |" >> $GITHUB_STEP_SUMMARY
