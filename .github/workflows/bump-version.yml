name: Bump Version & Tag

# Lanzado manualmente para crear un tag vX.Y.Z sobre una rama release/x.y.x.
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch to tag (e.g. release/2.0.x)'
        required: true
        default: 'release/2.0.x'
      bump_type:
        description: 'Type of version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.release_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and tag (manual)
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          set -euo pipefail

          # Obtain latest tag; default to 0.0.0 if none.
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          VERSION="${LAST_TAG#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "${BUMP_TYPE}" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
            *)
              echo "Unknown bump type: ${BUMP_TYPE}"; exit 1 ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "Last tag: ${LAST_TAG}"
          echo "New tag: ${NEW_TAG}"

          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
