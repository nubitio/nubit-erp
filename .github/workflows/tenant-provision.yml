name: Tenant Provision

on:
  workflow_dispatch:
    inputs:
      tenant_name:
        description: "Tenant name (slug)"
        required: true
        type: string
      domain:
        description: "Primary domain (e.g. acme.example.com)"
        required: true
        type: string
      admin_user:
        description: "Admin username"
        required: true
        type: string
      target_container:
        description: "Container name to run provisioning in (e.g. efact-dev, efact, efact-stg)"
        required: true
        default: "efact-dev"
        type: string

jobs:
  provision:
    runs-on: [ self-hosted, ops.efact ]
    env:
      PROVISIONING_DATABASE_URL: ${{ secrets.PROVISIONING_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision tenant
        env:
          TENANT_DB_PASS: ${{ secrets.TENANT_DB_PASS }}
          TENANT_ADMIN_PASS: ${{ secrets.TENANT_ADMIN_PASS }}
        run: |
          TARGET="${{ inputs.target_container }}"
          CONTAINER="$(docker ps --format '{{.Names}}' | awk -v t="$TARGET" '$0==t{print; exit}')"
          if [ -z "$CONTAINER" ]; then
            CONTAINER="$(docker ps --format '{{.Names}}' | awk -v t="$TARGET" 'index($0,t)==1{print; exit}')"
          fi
          if [ -z "$CONTAINER" ]; then
            echo "Container not found. Running containers:"
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            exit 1
          fi

          echo "Using container: $CONTAINER"
          docker exec -i \
            -e TENANT_DB_PASS="$TENANT_DB_PASS" \
            -e TENANT_ADMIN_PASS="$TENANT_ADMIN_PASS" \
            "$CONTAINER" php bin/console app:tenant:provision "${{ inputs.tenant_name }}" \
            --domain="${{ inputs.domain }}" \
            --create-user \
            --setup \
            --admin-user="${{ inputs.admin_user }}" \
            --no-interaction
