name: Deploy to Production (Docker)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  code_quality:
    name: Code quality check
    uses: ./.github/workflows/code_quality.yml

  build-docker:
    name: Build Docker Image
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write
    needs: [code_quality]
    with:
      environment: prod
      image_tag: ${{ github.ref_name }}

  deploy:
    name: Deploy to Portainer
    uses: ./.github/workflows/docker-deploy.yml
    needs: [build-docker]
    with:
      environment: prod
      docker_image: ${{ needs.build-docker.outputs.image }}
    secrets:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
      PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID_PROD }}
      PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID || '1' }}
