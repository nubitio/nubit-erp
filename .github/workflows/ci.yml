name: CI

on:
  push:
    branches:
      - main
      - release
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - release
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '20'
  COMPOSER_CACHE_VERSION: v2

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?:\ .+ ]]; then
            echo "::error::PR title must follow Conventional Commits format"
            echo "Expected format: type(scope): description"
            echo "Example: feat(auth): add JWT authentication"
            exit 1
          fi

      - name: Detect merge conflict markers
        run: |
          if git grep -n "<<<<<<< HEAD" -- ':!vendor' ':!node_modules' ':!.github/workflows/*'; then
            echo "::error::Merge conflict markers detected"
            exit 1
          fi

      - name: Check for oversized files
        run: |
          large_files=$(find . -type f -size +10M -not -path "./.git/*" -not -path "./vendor/*" -not -path "./node_modules/*" -not -path "./var/*" -not -path "./public/build/*")
          if [ -n "$large_files" ]; then
            echo "::error::Files over 10MB detected (should use Git LFS):"
            echo "$large_files"
            exit 1
          fi

      - name: Validate composer.json
        run: |
          if [ -f composer.json ]; then
            composer validate --strict --no-check-all --no-check-publish
          fi

      - name: Validate package.json
        run: |
          if [ -f package.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          fi

  backend:
    name: PHP Quality & Tests
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db?serverVersion=8.0
      REDIS_URL: redis://127.0.0.1:6379
      APP_SECRET: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, intl, json, pdo_mysql, redis, zip, opcache, apcu, protobuf, opentelemetry
          coverage: xdebug
          ini-values: memory_limit=512M

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ env.COMPOSER_CACHE_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ env.COMPOSER_CACHE_VERSION }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run database migrations
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test --allow-no-migration || true

      - name: Run GrumPHP
        run: ./vendor/bin/grumphp run --no-interaction

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text --log-junit=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            junit.xml
          retention-days: 30

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: PHPUnit Tests
          path: junit.xml
          reporter: java-junit

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint JavaScript/TypeScript
        run: yarn lint

      - name: Type check TypeScript
        run: yarn type-check

      - name: Build themes
        run: |
          mkdir -p public/themes
          yarn build:themes

      - name: Build assets
        run: yarn build

      - name: Check build size
        run: |
          if [ -d "public/build" ]; then
            BUILD_SIZE=$(du -sh public/build | cut -f1)
            echo "### Build Size: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            public/build
            public/themes
          retention-days: 7
          compression-level: 9

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [preflight, backend, frontend]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Generate CI summary
        run: |
          echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Preflight | ${{ needs.preflight.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.backend.result }}" == "success" && "${{ needs.frontend.result }}" == "success" ]]; then
            echo "✅ **All checks passed!** Ready to merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed.** Please review the errors above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if critical jobs failed
        run: |
          if [[ "${{ needs.preflight.result }}" == "failure" ]] || \
             [[ "${{ needs.backend.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "::error::One or more critical CI jobs failed"
            exit 1
          fi

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              preflight: '${{ needs.preflight.result }}',
              backend: '${{ needs.backend.result }}',
              frontend: '${{ needs.frontend.result }}'
            };

            const getEmoji = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'skipped': return '⏭️';
                default: return '⚠️';
              }
            };

            const body = `## CI Pipeline Results

            | Stage | Status |
            |-------|--------|
            | Preflight Checks | ${getEmoji(results.preflight)} ${results.preflight} |
            | Backend Tests | ${getEmoji(results.backend)} ${results.backend} |
            | Frontend Build | ${getEmoji(results.frontend)} ${results.frontend} |

            ${Object.values(results).every(r => r === 'success')
              ? '✅ All checks passed! Ready to merge.'
              : '❌ Some checks failed. Please review the logs.'}
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
