name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '20'
  COMPOSER_CACHE_VERSION: v1

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?:\ .+ ]]; then
            echo "PR title must follow Conventional Commits (e.g., 'feat: add payments')."
            exit 1
          fi

      - name: Detect merge conflict markers
        run: |
          if git grep -n "<<<<<<< HEAD" -- ':!vendor' ':!node_modules' ':!.github/workflows/*'; then
            echo "Merge conflict markers detected."
            exit 1
          fi

      - name: Check for oversized files
        run: |
          large_files=$(find . -type f -size +5M -not -path "./.git/*" -not -path "./vendor/*" -not -path "./node_modules/*")
          if [ -n "$large_files" ]; then
            echo "Files over 5MB detected:"
            echo "$large_files"
            exit 1
          fi

  backend:
    name: PHP Quality & Tests
    runs-on: ubuntu-latest
    needs: preflight

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 6379:6379

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db?serverVersion=8.0
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, intl, json, pdo_mysql, redis, zip, opcache, apcu, protobuf, opentelemetry
          coverage: xdebug
          ini-values: memory_limit=512M

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ env.COMPOSER_CACHE_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ env.COMPOSER_CACHE_VERSION }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run database migrations
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test --allow-no-migration || true

      - name: Run GrumPHP
        run: ./vendor/bin/grumphp run --no-interaction

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-coverage
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build assets
        run: |
          mkdir -p public/themes
          yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            public/build
            public/themes
          retention-days: 7

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || \
                "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
