name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        default: stg
    secrets:
      SSH_HOST:
        required: true
      SSH_HOST_KEY:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: curl, intl, json, pdo, soap, zip

      - name: Cache Composer dependencies
        uses: actions/cache@v2
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Download build artifact
        uses: actions/download-artifact@v2
        with:
          name: build
          path: public/build

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Add known hosts
        run: echo "${{ secrets.SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Delete old files
        run: ssh -p 22 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -rf /web/vendor && rm -rf /web/public/build && rm -rf /web/public/assets"

      - name: Deploy with rsync
        run: rsync -auzP --force --delete --progress --exclude-from=deploy_exclude.txt -e 'ssh -p 22' ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/web/

      - name: Clear cache
        run: ssh -p 22 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /web && php8.2 bin/console cache:clear"
