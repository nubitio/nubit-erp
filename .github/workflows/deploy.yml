name: Reusable Deploy

# Reusable workflow for deployments; invoked by environment-specific workflows.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (testing|staging|production)'
        required: true
        type: string
      version:
        description: 'Version or tag being deployed'
        required: true
        type: string
      image_tag:
        description: 'Override image tag (optional)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: '8.5'
  NODE_VERSION: '20'

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_env: ${{ steps.detect.outputs.target_env }}
      build_target: ${{ steps.detect.outputs.build_target }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      environment_name: ${{ steps.detect.outputs.environment_name }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}

    steps:
      - name: Detect target env & image tag
        id: detect
        env:
          TARGET_INPUT_ENV: ${{ inputs.environment }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TARGET_ENV=""
          BUILD_TARGET=""
          IMAGE_TAG=""
          ENV_NAME=""
          SHOULD_DEPLOY="false"

          case "${TARGET_INPUT_ENV}" in
            testing)
              TARGET_ENV="test"
              BUILD_TARGET="dev"
              ENV_NAME="testing"
              ;;
            staging)
              TARGET_ENV="stg"
              BUILD_TARGET="stg"
              ENV_NAME="staging"
              ;;
            production)
              TARGET_ENV="prod"
              BUILD_TARGET="prod"
              ENV_NAME="production"
              ;;
            *)
              echo "Unknown environment: ${TARGET_INPUT_ENV}"
              exit 1
              ;;
          esac

          if [[ -n "${INPUT_IMAGE_TAG:-}" ]]; then
            IMAGE_TAG="${INPUT_IMAGE_TAG}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            IMAGE_TAG="${INPUT_VERSION}"
          else
            IMAGE_TAG="${SHA}"
          fi

          SHOULD_DEPLOY="true"

          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "build_target=${BUILD_TARGET}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "environment_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    if: needs.plan.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    outputs:
      image: ${{ steps.primary-tag.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # primary tag from plan
            type=raw,value=${{ needs.plan.outputs.image_tag }}
            # branch/tag-based tags
            type=ref,event=branch
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' }}
            # always add sha tag
            type=sha,prefix=sha-
            # only tag latest for production
            type=raw,value=latest,enable=${{ needs.plan.outputs.target_env == 'prod' }}
          labels: |
            org.opencontainers.image.title=eFact
            org.opencontainers.image.description=Symfony application with FrankenPHP
            org.opencontainers.image.vendor=Nubit Team

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ needs.plan.outputs.build_target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ needs.plan.outputs.build_target }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.build_target }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          provenance: false

      - name: Primary image tag
        id: primary-tag
        run: |
          # First line from metadata tags is the "primary" one
          TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "image=${TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ Pushed ${TAG}" >> $GITHUB_STEP_SUMMARY

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.primary-tag.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.primary-tag.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ needs.plan.outputs.target_env }}
          path: sbom.spdx.json
          retention-days: 90

  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - plan
      - build-and-push
    if: needs.plan.outputs.should_deploy == 'true'
    environment:
      name: ${{ needs.plan.outputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment notification
        run: |
          echo "## 🚀 Deployment Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.plan.outputs.environment_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build-and-push.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.plan.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ needs.build-and-push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

      - name: Deploy stack
        id: deploy
        uses: dann41/portainer-stack-deploy@v1
        with:
          portainer-host: ${{ secrets.PORTAINER_URL }}
          access-token: ${{ secrets.PORTAINER_API_TOKEN }}
          stack-name: ${{ secrets.PORTAINER_STACK_NAME }}
          endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          stack-definition: docker-compose.prod.yml
          template-variables: '{"IMAGE": "${{ needs.build-and-push.outputs.image }}", "CONTAINER_NAME": "efact-${{ needs.plan.outputs.target_env }}"}'
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Wait for deployment health check
        run: |
          echo "Waiting for application to be healthy..."
          sleep 30

          # Try to check health endpoint if available
          if [ -n "${{ secrets.APP_URL }}" ]; then
            for i in {1..10}; do
              if curl -sf "${{ secrets.APP_URL }}/health" > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                exit 0
              fi
              echo "Waiting for application... (attempt $i/10)"
              sleep 10
            done
            echo "⚠️ Health check inconclusive, check manually"
          fi

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** ${{ secrets.APP_URL }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check Portainer logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  post-deploy:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, build-and-push, deploy]
    if: always() && needs.deploy.result == 'success'

    steps:
      - name: Smoke tests
        run: |
          echo "## 🧪 Running Smoke Tests" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ secrets.APP_URL }}" ]; then
            # Check if app is responding
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}" || echo "000")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "✅ Application is responding (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Application returned HTTP $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployStatus = '${{ needs.deploy.result }}';
            const env = '${{ needs.plan.outputs.environment_name }}';
            const image = '${{ needs.build-and-push.outputs.image }}';

            const emoji = deployStatus === 'success' ? '✅' : '❌';
            const message = `${emoji} Deployment to **${env}** ${deployStatus === 'success' ? 'succeeded' : 'failed'}

            **Image:** \`${image}\`
            **Workflow:** ${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            // You can add Slack/Discord notification here
            console.log(message);
