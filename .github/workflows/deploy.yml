name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev|stg|prod)
        required: true
        type: string
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        required: true
        type: string
      run_healthcheck:
        description: Run post-deploy healthcheck
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy stack in Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STACK_NAME: ${{ secrets.PORTAINER_STACK_NAME }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          COMPOSE_FILE: docker-compose.prod.yml
          IMAGE: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          bash scripts/portainer-deploy.sh

      - name: Healthcheck
        if: ${{ inputs.run_healthcheck }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL not set; skipping healthcheck."
            exit 0
          fi

          echo "Waiting for application to become healthy..."
          sleep 20
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/health/live" 2>/dev/null || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Healthy (HTTP 200)."
              exit 0
            fi
            echo "Attempt ${i}/12 failed (HTTP ${HTTP_STATUS:-000}). Retrying..."
            sleep 10
          done

          echo "Healthcheck failed."
          exit 1
