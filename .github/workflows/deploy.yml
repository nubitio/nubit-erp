name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev|stg|prod)
        required: true
        type: string
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        required: true
        type: string
      ref:
        description: Source commit containing the matching Compose definition
        type: string
        default: ''
      run_migrations:
        description: >-
          Run forward migrations for dev and staging. Ignored when environment
          is prod. Default true, so existing dev/staging callers keep migrating.
        type: boolean
        default: true
      prod_migrations:
        description: >-
          Run forward migrations only when environment is prod. Default false.
          A caller that omits this input does not migrate production, even if
          run_migrations is true. Requires a prior backup and DDL the previous
          image can still run. An image rollback does not undo the database.
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate deployment configuration
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: ': "${APP_URL:?APP_URL is required before changing the stack}"'

      - name: Validate immutable image reference
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          bash scripts/ci/validate-image-ref.sh "${IMAGE_REF}"

      - name: Resolve migration flag
        id: migrations
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          RUN_MIGRATIONS_INPUT: ${{ inputs.run_migrations == true && 'true' || 'false' }}
          PROD_MIGRATIONS_INPUT: ${{ inputs.prod_migrations == true && 'true' || 'false' }}
        run: python3 scripts/ci/resolve-migrations.py

      - name: Deploy stack in Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STACK_NAME: ${{ secrets.PORTAINER_STACK_NAME }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          COMPOSE_FILE: docker-compose.prod.yml
          IMAGE: ${{ inputs.image_ref }}
          RUN_MIGRATIONS: ${{ steps.migrations.outputs.run }}
        run: |
          set -euo pipefail
          bash scripts/portainer-deploy.sh

      - name: Required post-deploy smoke gate
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          : "${APP_URL:?APP_URL is required for the post-deploy smoke gate; refusing to promote}"
          for i in {1..18}; do
            if bash scripts/ops/production-smoke.sh; then
              exit 0
            fi
            echo "Attempt ${i}/18 failed. Retrying..."
            sleep 5
          done
          echo "Smoke verification failed; promotion halted." >&2
          exit 1
