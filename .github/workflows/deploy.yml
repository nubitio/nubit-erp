name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev|stg|prod)
        required: true
        type: string
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        required: true
        type: string
      run_healthcheck:
        description: Run post-deploy healthcheck
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Deploy stack in Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STACK_NAME: ${{ secrets.PORTAINER_STACK_NAME }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          COMPOSE_FILE: docker-compose.prod.yml
          IMAGE: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          bash scripts/portainer-deploy.sh

      - name: Healthcheck
        if: ${{ inputs.run_healthcheck }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL is required when run_healthcheck=true." >&2
            exit 1
          fi
          for i in {1..18}; do
            if bash scripts/ops/production-smoke.sh; then
              exit 0
            fi
            echo "Attempt ${i}/18 failed. Retrying..."
            sleep 5
          done
          echo "Smoke verification failed; promotion halted." >&2
          exit 1
