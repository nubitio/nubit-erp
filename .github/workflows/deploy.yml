name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        type: string
      version:
        description: 'Version being deployed'
        required: false
        type: string
      image_tag:
        description: 'Override image tag (optional)'
        required: false
        type: string
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      image_tag:
        description: 'Override image tag (optional)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: '8.5'
  NODE_VERSION: '20'

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_env: ${{ steps.detect.outputs.target_env }}
      build_target: ${{ steps.detect.outputs.build_target }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      environment_name: ${{ steps.detect.outputs.environment_name }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}

    steps:
      - name: Detect target env & image tag
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          DISPATCH_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          CALL_ENV: ${{ inputs.environment }}
          CALL_VERSION: ${{ inputs.version }}
          CALL_IMAGE_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TARGET_ENV=""
          BUILD_TARGET=""
          IMAGE_TAG=""
          ENV_NAME=""
          SHOULD_DEPLOY="false"

          case "${EVENT_NAME}" in
            workflow_call)
              if [[ -z "${CALL_ENV:-}" || "${CALL_ENV}" == "production" ]]; then
                TARGET_ENV="prod"
                BUILD_TARGET="prod"
                ENV_NAME="production"
              else
                TARGET_ENV="stg"
                BUILD_TARGET="stg"
                ENV_NAME="staging"
              fi

              if [[ -n "${CALL_IMAGE_TAG:-}" ]]; then
                IMAGE_TAG="${CALL_IMAGE_TAG}"
              elif [[ -n "${CALL_VERSION:-}" ]]; then
                IMAGE_TAG="${CALL_VERSION}"
              else
                IMAGE_TAG="${SHA}"
              fi

              SHOULD_DEPLOY="true"
              ;;
            workflow_dispatch)
              if [[ "${DISPATCH_ENV}" == "production" ]]; then
                TARGET_ENV="prod"
                BUILD_TARGET="prod"
                ENV_NAME="production"
              else
                TARGET_ENV="stg"
                BUILD_TARGET="stg"
                ENV_NAME="staging"
              fi

              # If image_tag is empty, use commit SHA
              if [[ -n "${DISPATCH_IMAGE_TAG:-}" ]]; then
                IMAGE_TAG="${DISPATCH_IMAGE_TAG}"
              else
                IMAGE_TAG="${SHA}"
              fi

              SHOULD_DEPLOY="true"
              ;;
            push)
              if [[ "${REF_TYPE}" == "tag" ]]; then
                TARGET_ENV="prod"
                BUILD_TARGET="prod"
                ENV_NAME="production"
                IMAGE_TAG="${REF_NAME}"
                SHOULD_DEPLOY="true"
              elif [[ "${REF_TYPE}" == "branch" ]] && [[ "${REF_NAME}" == "main" || "${REF_NAME}" == "release" ]]; then
                TARGET_ENV="stg"
                BUILD_TARGET="stg"
                ENV_NAME="staging"
                IMAGE_TAG="${REF_NAME}"
                SHOULD_DEPLOY="true"
              fi
              ;;
          esac

          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "build_target=${BUILD_TARGET}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "environment_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.primary-tag.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # primary tag from plan
            type=raw,value=${{ needs.plan.outputs.image_tag }}
            # branch/tag-based tags
            type=ref,event=branch
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' }}
            # always add sha tag
            type=sha,prefix=sha-
            # only tag latest for production
            type=raw,value=latest,enable=${{ needs.plan.outputs.target_env == 'prod' }}
          labels: |
            org.opencontainers.image.title=eFact
            org.opencontainers.image.description=Symfony application with FrankenPHP
            org.opencontainers.image.vendor=Nubit Team

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ needs.plan.outputs.build_target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ needs.plan.outputs.build_target }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.build_target }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          provenance: false

      - name: Primary image tag
        id: primary-tag
        run: |
          # First line from metadata tags is the "primary" one
          TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "image=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${TAG}"

  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - plan
      - build-and-push
    if: needs.plan.outputs.should_deploy == 'true'
    environment: ${{ needs.plan.outputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy stack
        uses: dann41/portainer-stack-deploy@v1
        with:
          portainer-host: ${{ secrets.PORTAINER_URL }}
          access-token: ${{ secrets.PORTAINER_API_TOKEN }}
          stack-name: ${{ secrets.PORTAINER_STACK_NAME }}
          endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          stack-definition: docker-compose.prod.yml
          image: ${{ needs.build-and-push.outputs.image }}
