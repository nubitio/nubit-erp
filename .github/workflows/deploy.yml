name: Deploy

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      image_tag:
        description: 'Override image tag (optional)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: '8.5'
  NODE_VERSION: '20'

jobs:
  plan:
    name: Plan Deployment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.detect.outputs.target_env }}
      build_target: ${{ steps.detect.outputs.build_target }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      environment_name: ${{ steps.detect.outputs.environment_name }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}

    steps:
      - id: detect
        run: |
          TARGET_ENV=""
          BUILD_TARGET=""
          IMAGE_TAG=""
          ENV_NAME=""
          SHOULD_DEPLOY="false"
          REF_NAME="${GITHUB_REF##*/}"

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
                TARGET_ENV="prod"
                BUILD_TARGET="prod"
                ENV_NAME="production"
              else
                TARGET_ENV="stg"
                BUILD_TARGET="stg"
                ENV_NAME="staging"
              fi
              IMAGE_TAG="${{ github.event.inputs.image_tag || github.sha }}"
              SHOULD_DEPLOY="true"
              ;;
            push)
              if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                TARGET_ENV="prod"
                BUILD_TARGET="prod"
                ENV_NAME="production"
                IMAGE_TAG="$REF_NAME"
                SHOULD_DEPLOY="true"
              elif [[ "$REF_NAME" == "main" || "$REF_NAME" == "develop" ]]; then
                TARGET_ENV="stg"
                BUILD_TARGET="stg"
                ENV_NAME="staging"
                IMAGE_TAG="$REF_NAME"
                SHOULD_DEPLOY="true"
              fi
              ;;
          esac

          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "build_target=$BUILD_TARGET" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "environment_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.primary-tag.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.plan.outputs.image_tag }}
            type=ref,event=branch
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ needs.plan.outputs.target_env == 'prod' }}
          labels: |
            org.opencontainers.image.title=eFact
            org.opencontainers.image.description=Symfony application with FrankenPHP
            org.opencontainers.image.vendor=Nubit Team

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ needs.plan.outputs.build_target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ needs.plan.outputs.build_target }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.build_target }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          provenance: false

      - name: Primary image tag
        id: primary-tag
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "image=$TAG" >> $GITHUB_OUTPUT
          echo "Pushed $TAG"

  scan-image:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: [plan, build-and-push]
    if: needs.plan.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always() && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    needs: [plan, build-and-push, scan-image]
    if: needs.plan.outputs.should_deploy == 'true'
    environment: ${{ needs.plan.outputs.environment_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare compose file with new image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          FULL_IMAGE="$IMAGE@$DIGEST"
          echo "Deploying image: $FULL_IMAGE"
          sed -i "s|image: .*|image: $FULL_IMAGE|g" docker-compose.prod.yml

      - name: Deploy stack via Portainer API
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STACK_ID: ${{ needs.plan.outputs.target_env == 'prod' && secrets.PORTAINER_STACK_ID_PROD || secrets.PORTAINER_STACK_ID_STG }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID || '1' }}
        run: |
          set -euo pipefail
          if [ -z "$PORTAINER_URL" ] || [ -z "$PORTAINER_TOKEN" ] || [ -z "$STACK_ID" ]; then
            echo "Missing Portainer configuration for ${{ needs.plan.outputs.environment_name }}"
            exit 1
          fi

          UPDATE_BODY=$(jq -Rs . < docker-compose.prod.yml)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"stackFileContent\":$UPDATE_BODY,\"prune\":true,\"pullImage\":true}")

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "Portainer response code: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "$BODY"
            exit 1
          fi
          echo "Stack update accepted."

      - name: Verify stack status
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STACK_ID: ${{ needs.plan.outputs.target_env == 'prod' && secrets.PORTAINER_STACK_ID_PROD || secrets.PORTAINER_STACK_ID_STG }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID || '1' }}
        run: |
          sleep 20
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -H "X-API-Key: $PORTAINER_TOKEN")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n1)

          if [ "$STATUS" != "200" ]; then
            echo "Unable to verify stack ($STATUS)"
            echo "$BODY"
            exit 1
          fi

          CODE=$(echo "$BODY" | jq -r '.Status')
          echo "Stack status: $CODE"
          if [ "$CODE" != "1" ]; then
            echo "$BODY"
            exit 1
          fi
