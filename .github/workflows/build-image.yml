name: Build Image

on:
  workflow_call:
    outputs:
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        value: ${{ jobs.build.outputs.image_ref }}
      image_tag:
        description: Primary mutable tag used for convenience
        value: ${{ jobs.build.outputs.image_tag }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: "8.5"
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve app version
        id: appver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            APP_VERSION=${{ steps.appver.outputs.version }}
          provenance: false

      - name: Publish outputs
        id: publish
        run: |
          set -euo pipefail
          IMAGE_TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          {
            echo "### Built Image"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Immutable: \`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
