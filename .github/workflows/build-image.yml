name: Build Image

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to build
        type: string
        default: ''
      version:
        description: SemVer release tag
        type: string
        default: ''
    outputs:
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        value: ${{ jobs.build.outputs.image_ref }}
      image_tag:
        description: Primary mutable tag used for convenience
        value: ${{ jobs.build.outputs.image_tag }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: "8.5.12"
  FRANKENPHP_VERSION: "1.13.2"
  FRANKENPHP_DEBIAN: "trixie"
  NODE_VERSION: "24.14.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve app version
        id: appver
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="$(git rev-parse --short=7 HEAD)"
          fi
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=sha-${{ steps.appver.outputs.short_sha }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=main,enable=${{ github.ref_name == 'main' && inputs.version == '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nubit-erp-prod
          cache-to: type=gha,mode=min,scope=nubit-erp-prod
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            FRANKENPHP_VERSION=${{ env.FRANKENPHP_VERSION }}
            FRANKENPHP_DEBIAN=${{ env.FRANKENPHP_DEBIAN }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            APP_VERSION=${{ steps.appver.outputs.version }}
          provenance: false

      - name: Publish outputs
        id: publish
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_TAG="${IMAGE_TAGS%%$'\n'*}"
          IMAGE_REF="${{ env.REGISTRY }}/${IMAGE_NAME,,}@${DIGEST}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          {
            echo "### Built Image"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Immutable: \`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
