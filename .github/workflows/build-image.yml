name: Build Image

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to build
        type: string
        default: ''
      version:
        description: SemVer release tag
        type: string
        default: ''
    outputs:
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        value: ${{ jobs.build.outputs.image_ref }}
      image_tag:
        description: Primary mutable tag used for convenience
        value: ${{ jobs.build.outputs.image_tag }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: "8.5.12"
  FRANKENPHP_VERSION: "1.13.2"
  FRANKENPHP_DEBIAN: "trixie"
  NODE_VERSION: "24.14.1"

jobs:
  build:
    runs-on: ${{ (vars.CI_RUNNER_PROVIDER == 'github' || ((vars.CI_RUNNER_PROVIDER == '' || vars.CI_RUNNER_PROVIDER == 'hybrid') && vars.CI_RUNNER_PROVIDER_HEAVY == 'github')) && 'ubuntu-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve app version
        id: appver
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Blacksmith Builder
        if: vars.CI_RUNNER_PROVIDER != 'github'
        uses: useblacksmith/setup-docker-builder@v1

      - name: Setup Docker Buildx
        if: vars.CI_RUNNER_PROVIDER == 'github'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=main,enable=${{ github.ref_name == 'main' && inputs.version == '' }}

      - name: Build and push (Blacksmith)
        id: build_bs
        if: vars.CI_RUNNER_PROVIDER != 'github'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          target: prod
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            FRANKENPHP_VERSION=${{ env.FRANKENPHP_VERSION }}
            FRANKENPHP_DEBIAN=${{ env.FRANKENPHP_DEBIAN }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            APP_VERSION=${{ steps.appver.outputs.version }}
          provenance: false

      - name: Build and push (GitHub)
        id: build_gh
        if: vars.CI_RUNNER_PROVIDER == 'github'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nubit-erp-prod
          cache-to: type=gha,mode=min,scope=nubit-erp-prod
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            FRANKENPHP_VERSION=${{ env.FRANKENPHP_VERSION }}
            FRANKENPHP_DEBIAN=${{ env.FRANKENPHP_DEBIAN }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            APP_VERSION=${{ steps.appver.outputs.version }}
          provenance: false

      - name: Publish outputs
        id: publish
        env:
          DIGEST: ${{ steps.build_bs.outputs.digest || steps.build_gh.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          {
            echo "### Built Image"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Immutable: \`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
