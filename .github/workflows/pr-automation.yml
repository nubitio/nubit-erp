name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - release

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Label PR based on files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Label based on PR title (Conventional Commits)
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];
            
            // Extract type from conventional commit
            const match = title.match(/^(\w+)(\(.+\))?:/);
            if (match) {
              const type = match[1];
              const typeLabels = {
                'feat': 'type: feature',
                'fix': 'type: bug',
                'docs': 'type: documentation',
                'style': 'type: style',
                'refactor': 'type: refactor',
                'perf': 'type: performance',
                'test': 'type: test',
                'build': 'type: build',
                'ci': 'type: ci',
                'chore': 'type: chore',
                'revert': 'type: revert'
              };
              
              if (typeLabels[type]) {
                labels.push(typeLabels[type]);
              }
              
              // Check for breaking changes
              if (title.includes('!') || title.includes('BREAKING CHANGE')) {
                labels.push('breaking change');
              }
            }
            
            // Add labels
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }

  pr-size:
    name: Label PR Size
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate PR size and add label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Get PR diff stats
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            // Calculate changes
            let additions = 0;
            let deletions = 0;
            files.forEach(file => {
              additions += file.additions;
              deletions += file.deletions;
            });
            
            const totalChanges = additions + deletions;
            
            // Determine size label
            let sizeLabel;
            if (totalChanges < 10) {
              sizeLabel = 'size: XS';
            } else if (totalChanges < 100) {
              sizeLabel = 'size: S';
            } else if (totalChanges < 500) {
              sizeLabel = 'size: M';
            } else if (totalChanges < 1000) {
              sizeLabel = 'size: L';
            } else {
              sizeLabel = 'size: XL';
            }
            
            // Remove old size labels
            const currentLabels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            
            for (const label of currentLabels.data) {
              if (label.name.startsWith('size: ')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label.name
                });
              }
            }
            
            // Add new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel]
            });
            
            // Add comment for large PRs
            if (totalChanges > 500) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `⚠️ **Large PR detected** (${totalChanges} lines changed)\n\nConsider splitting this PR into smaller chunks for easier review:\n- Break down by feature/component\n- Separate refactoring from new features\n- Create multiple smaller PRs`
              });
            }

  auto-assign-author:
    name: Auto Assign PR Author
    runs-on: ubuntu-latest
    
    steps:
      - name: Assign PR author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            try {
              // Assign the PR author to the PR
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login]
              });
              
              console.log(`✅ Assigned ${pr.user.login} to PR #${pr.number}`);
            } catch (error) {
              console.error(`❌ Failed to assign author: ${error.message}`);
            }

  check-linked-issues:
    name: Check Linked Issues
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            
            // Check for issue references
            const issuePatterns = [
              /closes #\d+/i,
              /fixes #\d+/i,
              /resolves #\d+/i,
              /relates to #\d+/i,
              /ref #\d+/i
            ];
            
            const hasIssueRef = issuePatterns.some(pattern => pattern.test(body));
            
            if (!hasIssueRef && !pr.title.toLowerCase().includes('chore')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `📝 **No linked issue found**\n\nPlease link this PR to an issue using:\n- \`Closes #123\`\n- \`Fixes #123\`\n- \`Resolves #123\`\n- \`Relates to #123\``
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['needs: issue link']
              });
            }

  check-pr-template:
    name: Check PR Template
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify PR template sections
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            
            const requiredSections = [
              '## Description',
              '## Type of Change',
              '## Testing'
            ];
            
            const missingSections = requiredSections.filter(section => 
              !body.includes(section)
            );
            
            if (missingSections.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `⚠️ **PR template incomplete**\n\nMissing sections:\n${missingSections.map(s => `- ${s}`).join('\n')}\n\nPlease update your PR description to include all required sections.`
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['needs: template']
              });
            }
