name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_MIN_PHP: '6.5'

jobs:
  backend:
    name: Backend Quality & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack
        run: |
          docker compose up -d database redis web

      - name: Install backend dependencies
        run: docker compose exec -T web composer install --no-interaction --no-progress --prefer-dist

      - name: Run GrumPHP
        run: docker compose exec -T web ./vendor/bin/grumphp run --no-interaction

      - name: Enable PCOV in web container
        run: |
          docker compose exec -T web sh -lc "php -m | grep -q '^pcov$' || (printf '\n' | pecl install pcov && echo extension=pcov.so > /usr/local/etc/php/conf.d/zz-pcov.ini)"

      - name: Run PHPUnit with coverage
        run: |
          docker compose exec -T web php -d pcov.enabled=1 -d pcov.directory=/app/src ./vendor/bin/phpunit -c phpunit.coverage.xml

      - name: Enforce backend coverage threshold
        run: |
          docker compose exec -T web php scripts/ci/check-php-coverage.php var/coverage/php/clover.xml ${{ env.COVERAGE_MIN_PHP }}

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: var/coverage/php

      - name: Stop backend stack
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend Lint, Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Start frontend stack
        run: docker compose up -d vite

      - name: Install frontend dependencies
        run: docker compose exec -T vite yarn install --immutable

      - name: Lint JavaScript and TypeScript
        run: docker compose exec -T vite yarn lint

      - name: Run frontend unit tests with coverage gates
        run: docker compose exec -T vite yarn test

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: var/coverage/frontend

      - name: Stop frontend stack
        if: always()
        run: docker compose down -v

  e2e:
    name: End-to-End Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend

    env:
      E2E_BASE_URL: http://web

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d database redis web vite

      - name: Install dependencies for e2e
        run: |
          docker compose exec -T web composer install --no-interaction --no-progress --prefer-dist
          docker compose exec -T vite yarn install --immutable

      - name: Seed E2E data on-the-fly
        run: |
          E2E_SEED_JSON=$(docker compose exec -T -e E2E_SEED_ENABLED=1 web php bin/console app:test:seed-e2e | tail -n 1)
          echo "E2E_SEED_JSON=$E2E_SEED_JSON"
          echo "E2E_USERNAME=$(echo "$E2E_SEED_JSON" | jq -r '.username')" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(echo "$E2E_SEED_JSON" | jq -r '.password')" >> "$GITHUB_ENV"
          echo "E2E_SALE_ID=$(echo "$E2E_SEED_JSON" | jq -r '.saleId')" >> "$GITHUB_ENV"

      - name: Run Playwright e2e tests
        run: docker compose exec -T vite yarn test:e2e

      - name: Cleanup E2E seeded data
        if: always()
        run: docker compose exec -T -e E2E_SEED_ENABLED=1 web php bin/console app:test:reset-e2e || true

      - name: Stop full stack
        if: always()
        run: docker compose down -v
