name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer push must never interrupt a release/production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  COVERAGE_MIN_PHP: '40'
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

jobs:
  semantic-pr-title:
    name: Semantic PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Enforce Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert

  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.jobs.outputs.backend }}
      frontend: ${{ steps.jobs.outputs.frontend }}
    steps:
      - name: Detect changed areas
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'config/**'
              - 'migrations/**'
              - 'migrations_control_plane/**'
              - 'composer.json'
              - 'composer.lock'
              - 'symfony.lock'
              - 'phpunit.xml.dist'
              - 'phpunit.coverage.xml'
              - 'phpstan.dist.neon'
              - 'tools/phpstan/**'
              - 'mago.toml'
              - 'rector.php'
              - 'phparkitect.php'
              - 'phparkitect-baseline.json'
              - 'linter-baseline.toml'
              - 'analyzer-baseline.toml'
              - 'scripts/architecture/**'
              - 'scripts/ci/**'
              - 'scripts/api/**'
              - 'docs/api/**'
              - 'assets/api/types.generated.ts'
              - 'scripts/quality-check.sh'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-compose.ci.yml'
              - 'docker/**'
              - 'bin/**'
              - 'templates/**'
              - 'translations/**'
              - '.github/workflows/ci-main.yml'
              - '.github/actions/**'
            frontend:
              - 'assets/**'
              - 'docs/api/public-v1.yaml'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'vite.config.js'
              - 'tsconfig.json'
              - 'postcss.config.mjs'
              - 'scripts/copy-themes.mjs'
              - '.github/workflows/ci-main.yml'
              - '.github/actions/**'

      - name: Resolve jobs
        id: jobs
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          set -euo pipefail
          if [ "$FORCE_ALL" = "true" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Running full suite (manual dispatch)."
            exit 0
          fi

          echo "backend=${FILTER_BACKEND:-false}" >> "$GITHUB_OUTPUT"
          echo "frontend=${FILTER_FRONTEND:-false}" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Quality & Coverage
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: mysql://root:changeme@database:3306/demo_test?serverVersion=10.7.1-MariaDB&charset=utf8mb4

    steps:
      - name: Skip (no backend changes)
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend-relevant changes on this PR."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.backend == 'true'
        with:
          persist-credentials: false

      - name: Start backend stack
        if: needs.changes.outputs.backend == 'true'
        uses: ./.github/actions/ci-stack
        with:
          services: database redis web

      - name: Install backend dependencies
        if: needs.changes.outputs.backend == 'true'
        run: docker compose exec -T web composer install --no-interaction --no-progress --prefer-dist

      - name: Run Mago lint + format check
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T web mago lint
          docker compose exec -T web mago analyze --fail-on-out-of-sync-baseline
          docker compose exec -T web mago fmt --check

      - name: Run Platform boundary guard
        if: needs.changes.outputs.backend == 'true'
        run: docker compose exec -T web php scripts/architecture/check-platform-boundary.php

      - name: Check versioned public API contract
        if: needs.changes.outputs.backend == 'true'
        run: docker compose exec -T web php scripts/api/check-public-contract.php

      - name: Check frontend API types are in sync with the backend
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - name: Verify frontend API types are in sync with the backend
        if: needs.changes.outputs.backend == 'true'
        run: bash scripts/api/app-types.sh --check

      - name: Run architecture rules (AR-001…AR-010)
        if: needs.changes.outputs.backend == 'true'
        run: docker compose exec -T web composer check:architecture

      - name: Check every API write operation is guarded
        if: needs.changes.outputs.backend == 'true'
        run: docker compose exec -T web php bin/console nubit:security:audit --strict

      - name: Run PHPStan
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T \
            -e OTEL_SDK_DISABLED=true \
            web php -d memory_limit=1G vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --no-progress

      - name: Run PHPStan level 9 for bank reconciliation
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T \
            -e OTEL_SDK_DISABLED=true \
            web php -d memory_limit=1G vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --level=9 --no-progress src/BankReconciliation

      - name: Create and migrate test database
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T database mariadb -uroot -pchangeme -e "DROP DATABASE IF EXISTS demo_test; CREATE DATABASE demo_test CHARACTER SET utf8mb4;"
          docker compose exec -T \
            -e APP_ENV=test \
            -e DATABASE_URL="${DATABASE_URL}" \
            web php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run core operational kernel tests
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T \
            -e OTEL_SDK_DISABLED=true \
            -e APP_ENV=test \
            -e APP_SECRET=test-secret-for-kernel-tests-32b \
            -e DATABASE_URL="${DATABASE_URL}" \
            web php -d memory_limit=512M /app/vendor/bin/phpunit --do-not-fail-on-deprecation --do-not-fail-on-phpunit-deprecation tests/ReleaseCritical/CoreOperationalPathTest.php tests/ReleaseCritical/CoreInventoryPathTest.php tests/ReleaseCritical/CorePurchasePathTest.php

      - name: Run PHPUnit with coverage
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T \
            -e OTEL_SDK_DISABLED=true \
            -e APP_ENV=test \
            -e APP_SECRET=test-secret-for-kernel-tests-32b \
            -e DATABASE_URL="${DATABASE_URL}" \
            web php -d pcov.enabled=1 -d memory_limit=1G -d pcov.directory=/app/src ./vendor/bin/pest -c phpunit.coverage.xml --do-not-fail-on-deprecation --do-not-fail-on-phpunit-deprecation

      - name: Enforce backend coverage threshold
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T web php scripts/ci/check-php-coverage.php var/coverage/php/clover.xml ${{ env.COVERAGE_MIN_PHP }}

      - name: Copy backend coverage from Docker volume
        if: needs.changes.outputs.backend == 'true'
        run: |
          rm -rf "${RUNNER_TEMP}/php-coverage"
          mkdir -p "${RUNNER_TEMP}/php-coverage"
          docker compose cp web:/app/var/coverage/php/. "${RUNNER_TEMP}/php-coverage/"

      - name: Upload backend coverage artifact
        if: needs.changes.outputs.backend == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/php-coverage
          if-no-files-found: error
          retention-days: 7

      - name: Collect backend stack diagnostics
        if: failure() && needs.changes.outputs.backend == 'true'
        run: docker compose ps -a && docker compose logs --no-color --tail=150

      - name: Stop backend stack
        if: always() && needs.changes.outputs.backend == 'true'
        run: docker compose down -v

  frontend:
    name: Frontend Lint, Tests & Coverage
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Skip (no frontend changes)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend-relevant changes on this PR."

      - uses: actions/checkout@v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          persist-credentials: false

      - name: Setup Node and Yarn
        if: needs.changes.outputs.frontend == 'true'
        uses: ./.github/actions/setup-yarn

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: yarn install --immutable

      - name: Regenerate public API types
        if: needs.changes.outputs.frontend == 'true'
        run: yarn generate:api-types && git diff --exit-code -- assets/api/public-v1.types.generated.ts

      - name: Lint JavaScript and TypeScript
        if: needs.changes.outputs.frontend == 'true'
        run: yarn lint

      - name: TypeScript type check
        if: needs.changes.outputs.frontend == 'true'
        run: yarn tsc --noEmit

      - name: Run frontend tests with coverage
        if: needs.changes.outputs.frontend == 'true'
        run: yarn test

      - name: Upload frontend coverage artifact
        if: needs.changes.outputs.frontend == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: var/coverage/frontend
          retention-days: 7

  deploy-tooling:
    name: Deployment tooling checks
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash -n scripts/portainer-deploy.sh
      - run: python3 scripts/ci/test-release-pipeline.py
      - name: Install workflow test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-tests"
          "$RUNNER_TEMP/workflow-tests/bin/python" -m pip install PyYAML==6.0.3
          echo "$RUNNER_TEMP/workflow-tests/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/ci/test-release-workflows.py

  release:
    name: Release after quality gates
    # The ruleset already requires the PR checks. Gate releases on E2E
    # against the actual commit on main, not on skipped PR-only jobs.
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    secrets: inherit

  deploy-dev:
    name: Deploy verified image to Dev
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_ref: ${{ needs.release.outputs.image_ref }}
      ref: ${{ github.sha }}
    secrets: inherit

  e2e:
    name: End-to-End Workflows
    # Keep E2E off automatic PR runs; release still depends on it on main.
    # Manual dispatch can validate a feature branch without publishing.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      E2E_BASE_URL: http://demo
      APP_ENV: e2e
      # Match the Symfony cache explicitly warmed before Playwright.
      APP_DEBUG: '0'
      # Leave room for the dev dependencies and Symfony cache loaded by E2E.
      # Filling the OPcache hash table can abort FrankenPHP under PHP ZTS.
      FRANKENPHP_CONFIG: |
        php_ini opcache.max_accelerated_files 100000
        php_ini opcache.memory_consumption 512
      E2E_SEED_ENABLED: '1'
      DATABASE_URL: mysql://demo:changeme@database:3306/demo?serverVersion=10.7.1-MariaDB&charset=utf8mb4
      CONTROL_PLANE_DATABASE_URL: mysql://efact:changeme@database:3306/efact?serverVersion=10.7.1-MariaDB&charset=utf8mb4

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Start e2e stack
        uses: ./.github/actions/ci-stack
        with:
          services: database redis mercure web

      - name: Setup Node and Yarn
        uses: ./.github/actions/setup-yarn

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build frontend for E2E
        run: yarn build

      - name: Install PHP dependencies for e2e
        run: docker compose exec -T web composer install --no-interaction --no-progress --prefer-dist

      - name: Provision tenant database for e2e
        run: |
          docker compose exec -T database mariadb -h127.0.0.1 -uroot -pchangeme <<'SQL'
          CREATE DATABASE IF NOT EXISTS demo CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'demo'@'%' IDENTIFIED BY 'changeme';
          GRANT ALL PRIVILEGES ON demo.* TO 'demo'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Run database migrations for e2e
        run: |
          docker compose exec -T \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e CONTROL_PLANE_DATABASE_URL="${CONTROL_PLANE_DATABASE_URL}" \
            -e OTEL_TRACES_EXPORTER=none \
            -e OTEL_LOGS_EXPORTER=none \
            -e OTEL_METRICS_EXPORTER=none \
            web php bin/console app:control-plane:migrate --no-interaction
          docker compose exec -T \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e CONTROL_PLANE_DATABASE_URL="${CONTROL_PLANE_DATABASE_URL}" \
            -e OTEL_TRACES_EXPORTER=none \
            -e OTEL_LOGS_EXPORTER=none \
            -e OTEL_METRICS_EXPORTER=none \
            web php bin/console doctrine:migrations:migrate --no-interaction

      - name: Provision local E2E tenant registry record
        run: |
          docker compose exec -T database mariadb -uroot -pchangeme efact -e \
            "INSERT INTO tenants (name, connection, status, created_at, updated_at, deleted_at) VALUES ('demo', 'demo', 'active', NOW(), NOW(), NULL) ON DUPLICATE KEY UPDATE connection = 'demo', status = 'active', updated_at = NOW(), deleted_at = NULL;"

      - name: Seed E2E data on-the-fly
        run: |
          set -euo pipefail
          SEED_OUTPUT=$(docker compose exec -T \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e CONTROL_PLANE_DATABASE_URL="${CONTROL_PLANE_DATABASE_URL}" \
            -e E2E_SEED_ENABLED=1 \
            -e OTEL_TRACES_EXPORTER=none \
            -e OTEL_LOGS_EXPORTER=none \
            -e OTEL_METRICS_EXPORTER=none \
            web php bin/console app:test:seed-e2e)
          echo "$SEED_OUTPUT"
          E2E_SEED_JSON=$(echo "$SEED_OUTPUT" | grep -Eo '\{.*"saleId".*\}' | tail -n 1)
          test -n "$E2E_SEED_JSON"
          echo "$E2E_SEED_JSON" | jq -e '.username and .password and .saleId' >/dev/null
          echo "E2E_USERNAME=$(echo "$E2E_SEED_JSON" | jq -r '.username')" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(echo "$E2E_SEED_JSON" | jq -r '.password')" >> "$GITHUB_ENV"
          echo "E2E_SALE_ID=$(echo "$E2E_SEED_JSON" | jq -r '.saleId')" >> "$GITHUB_ENV"

      - name: Warm SPA before Playwright
        run: |
          set -euo pipefail
          # A health probe can look up the `demo` tenant before it is registered;
          # TenantService caches that miss for 300s and every request then 404s
          # with "Tenant not found". Drop it now that the tenant exists.
          # Composer and the seed use root, while FrankenPHP uses www-data.
          docker compose exec -T web chown -R www-data:www-data /app/var/cache/e2e
          docker compose exec -T --user www-data web php bin/console cache:pool:clear cache.app
          docker compose exec -T --user www-data web php bin/console cache:clear --no-warmup --no-debug
          docker compose exec -T --user www-data web php bin/console cache:warmup --no-debug
          bash scripts/ci/wait-for-spa-host.sh

      - name: Run Playwright e2e tests
        run: |
          docker compose --profile e2e run --rm --no-deps \
            -e CI \
            -e E2E_USERNAME \
            -e E2E_PASSWORD \
            -e E2E_SALE_ID \
            --entrypoint "" \
            e2e \
            sh /home/node/app/docker/ci-e2e-runner.sh

      - name: Collect E2E stack diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker events --since 30m --until "$(date +%s)" \
            --filter type=container --filter label=com.docker.compose.service=web \
            --filter event=die --filter event=oom --filter event=start \
            --format '{{.Time}} {{.Actor.Attributes.name}} {{.Action}} {{.Actor.Attributes.exitCode}}'
          docker compose logs --no-color --tail=150

      - name: Stop full stack
        if: always()
        run: docker compose down -v
