name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_MIN_PHP: '40' # SLICE-TEST-001: raised from 8% → 40% global threshold

jobs:
  backend:
    name: Backend Quality & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack
        run: |
          docker compose up -d database redis web

      - name: Install backend dependencies
        run: docker compose exec -T web composer install --no-interaction --no-progress --prefer-dist

      - name: Run GrumPHP
        # Level is enforced via phpstan.dist.neon (min: 6, see SLICE-SEC-001)
        run: |
          docker compose exec -T \
            -e OTEL_SDK_DISABLED=true \
            web ./vendor/bin/grumphp run --no-interaction

      - name: Enable PCOV in web container
        run: |
          docker compose exec -T web sh -lc "php -m | grep -q '^pcov$' || (printf '\n' | pecl install pcov && echo extension=pcov.so > /usr/local/etc/php/conf.d/zz-pcov.ini)"

      - name: Run PHPUnit with coverage
        run: |
          docker compose exec -T \
            -e OTEL_SDK_DISABLED=true \
            web php -d pcov.enabled=1 -d pcov.directory=/app/src ./vendor/bin/phpunit -c phpunit.coverage.xml

      - name: Enforce backend coverage threshold
        run: |
          docker compose exec -T web php scripts/ci/check-php-coverage.php var/coverage/php/clover.xml ${{ env.COVERAGE_MIN_PHP }}

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: var/coverage/php

      - name: Stop backend stack
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend Lint, Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.9.1 --activate

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Lint JavaScript and TypeScript
        run: yarn lint

      - name: TypeScript type check
        run: yarn tsc --noEmit

      - name: Run frontend unit tests with coverage gates
        run: yarn test

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: var/coverage/frontend

  e2e:
    name: End-to-End Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend

    env:
      E2E_BASE_URL: http://web
      DATABASE_URL: mysql://efact:changeme@database:3306/efact?serverVersion=10.7.1-MariaDB&charset=utf8mb4
      CONTROL_PLANE_DATABASE_URL: mysql://efact:changeme@database:3306/efact?serverVersion=10.7.1-MariaDB&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d database redis web vite

      - name: Install dependencies for e2e
        run: |
          docker compose exec -T web composer install --no-interaction --no-progress --prefer-dist
          docker compose exec -T vite sh -lc "corepack enable && yarn install --immutable"

      - name: Run database migrations for e2e
        run: |
          docker compose exec -T -e OTEL_TRACES_EXPORTER=none -e OTEL_LOGS_EXPORTER=none -e OTEL_METRICS_EXPORTER=none web php bin/console app:control-plane:migrate --no-interaction
          docker compose exec -T -e OTEL_TRACES_EXPORTER=none -e OTEL_LOGS_EXPORTER=none -e OTEL_METRICS_EXPORTER=none web php bin/console doctrine:migrations:migrate --no-interaction

      - name: Seed E2E data on-the-fly
        run: |
          set -euo pipefail
          SEED_OUTPUT=$(docker compose exec -T -e E2E_SEED_ENABLED=1 -e OTEL_TRACES_EXPORTER=none -e OTEL_LOGS_EXPORTER=none -e OTEL_METRICS_EXPORTER=none web php bin/console app:test:seed-e2e)
          echo "$SEED_OUTPUT"
          E2E_SEED_JSON=$(echo "$SEED_OUTPUT" | grep -Eo '\{.*"saleId".*\}' | tail -n 1)
          test -n "$E2E_SEED_JSON"
          echo "$E2E_SEED_JSON" | jq -e '.username and .password and .saleId' >/dev/null
          echo "E2E_USERNAME=$(echo "$E2E_SEED_JSON" | jq -r '.username')" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(echo "$E2E_SEED_JSON" | jq -r '.password')" >> "$GITHUB_ENV"
          echo "E2E_SALE_ID=$(echo "$E2E_SEED_JSON" | jq -r '.saleId')" >> "$GITHUB_ENV"

      - name: Run Playwright e2e tests
        run: |
          docker compose exec -T \
            -e E2E_USERNAME \
            -e E2E_PASSWORD \
            -e E2E_SALE_ID \
            vite sh -lc "corepack enable && yarn test:e2e"

      - name: Cleanup E2E seeded data
        if: always()
        run: docker compose exec -T -e E2E_SEED_ENABLED=1 -e OTEL_TRACES_EXPORTER=none -e OTEL_LOGS_EXPORTER=none -e OTEL_METRICS_EXPORTER=none web php bin/console app:test:reset-e2e || true

      - name: Stop full stack
        if: always()
        run: docker compose down -v
