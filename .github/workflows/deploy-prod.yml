name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to promote (v1.2.3); uses its existing image
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    uses: ./.github/workflows/resolve-release.yml
    with:
      release_tag: ${{ inputs.release_tag || github.event.release.tag_name }}
    secrets: inherit

  deploy-production:
    needs: resolve
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      # APP_URL is the required smoke target configured in the prod environment.
      image_ref: ${{ needs.resolve.outputs.image_ref }}
      ref: ${{ needs.resolve.outputs.commit }}
    secrets: inherit
