name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable image reference (ghcr.io/org/repo@sha256:...)
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-image:
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || inputs.image_ref == '' }}
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  resolve-input-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_ref != '' }}
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
    steps:
      - name: Use requested image reference
        id: resolve
        env:
          INPUT_IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          echo "image_ref=${INPUT_IMAGE_REF}" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs:
      - build-image
      - resolve-input-image
    if: ${{ always() && (needs.build-image.result == 'success' || needs.resolve-input-image.result == 'success') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image_ref: ${{ needs.resolve-input-image.outputs.image_ref || needs.build-image.outputs.image_ref }}
    secrets: inherit
