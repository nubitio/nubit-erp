name: Deploy to Production

# Se ejecuta cuando se crea un tag vX.Y.Z y despliega a producción.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version/tag (defaults to ref name)'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-production:
    name: Deploy to Production
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
