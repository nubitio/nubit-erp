name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        default: stg
    secrets:
      SSH_HOST:
        required: true
      SSH_HOST_KEY:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_BASE_PATH:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: curl, intl, json, pdo, soap, zip

      - name: Cache Composer dependencies
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-dev --classmap-authoritative

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: public

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Add known hosts
        run: echo "${{ secrets.SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Enable maintenance mode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "cd ${{ secrets.SSH_BASE_PATH }} && touch .maintenance"

      - name: Delete old files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf ${{ secrets.SSH_BASE_PATH }}vendor
            rm -rf ${{ secrets.SSH_BASE_PATH }}public/build
            rm -rf ${{ secrets.SSH_BASE_PATH }}public/assets
            rm -rf ${{ secrets.SSH_BASE_PATH }}public/themes

      - name: Deploy with rsync
        run: rsync -auzP --force --delete --progress --exclude-from=deploy_exclude.txt -e 'ssh -p 22' ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_BASE_PATH }}

      - name: Clear cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "cd ${{ secrets.SSH_BASE_PATH }} && php8.3 bin/console cache:clear --env=prod"

      - name: Update version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "cd ${{ secrets.SSH_BASE_PATH }} && echo ${{ github.ref_name }} > .version"

      - name: Disable maintenance mode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "cd ${{ secrets.SSH_BASE_PATH }} && rm .maintenance"
