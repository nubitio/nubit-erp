name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  static_code_analysis:
    name: Static Code Analysis
    uses: ./.github/workflows/analyze.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    needs: [ static_code_analysis ]

  unit_tests:
    name: Unit Tests
    uses: ./.github/workflows/test.yml
