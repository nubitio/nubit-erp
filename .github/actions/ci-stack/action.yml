name: Start CI stack
description: Cache Composer vendor, build the web image, and start the slim compose stack

inputs:
  services:
    description: Compose services to start
    required: false
    default: 'database redis web'

runs:
  using: composite
  steps:
    - name: Use CI compose overlay
      shell: bash
      run: echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml" >> "$GITHUB_ENV"

    - name: Restore Composer vendor cache
      uses: actions/cache@v5
      with:
        path: vendor
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ runner.os }}-

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build web image (GitHub cache)
      uses: docker/build-push-action@v6
      with:
        context: .
        target: dev
        load: true
        push: false
        pull: true
        tags: nubit-erp-ci-web:local
        cache-from: type=gha,scope=nubit-erp-web-dev
        cache-to: type=gha,mode=min,scope=nubit-erp-web-dev
        build-args: |
          PHP_VERSION=8.5.12
          FRANKENPHP_VERSION=1.13.2
          FRANKENPHP_DEBIAN=trixie

    - name: Start stack
      shell: bash
      env:
        COMPOSE_SERVICES: ${{ inputs.services }}
      run: |
        read -r -a services <<< "$COMPOSE_SERVICES"
        docker compose up -d --no-build "${services[@]}"
