# ============================================================================
# Git Cliff Configuration - Changelog Generation
# ============================================================================
# Configuration for generating beautiful changelogs from conventional commits

[changelog]
# Changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""

# Template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Parse the commits based on https://www.conventionalcommits.org
conventional_commits = true

# Filter out commits that are not conventional
filter_unconventional = true

# Process each line of a commit as an individual commit
split_commits = false

# Regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^test", group = "✅ Testing" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "🔧 Miscellaneous" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^build", group = "🏗️ Build" },
  { message = "^revert", group = "⏪ Reverts" },
]

# Protect breaking changes from being skipped
protect_breaking_commits = false

# Filter out commits
filter_commits = false

# Regex for matching git tags
tag_pattern = "v[0-9]*"

# Sort commits by oldest
sort_commits = "oldest"

# Limit the number of commits in the changelog
# limit_commits = 42
