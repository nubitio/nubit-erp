# Local replica of the CI e2e stack. Used by scripts/ci/e2e-local.sh as:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml:docker-compose.e2e-local.yml
#   COMPOSE_PROJECT_NAME=nubit-e2e
#
# It runs in its own compose project (own DB volume, own network) so it never
# touches the dev stack. The fixed container names in docker-compose.yml would
# collide with the dev containers, so they are dropped here. Playwright
# uses the `demo` alias from docker-compose.ci.yml.
services:
  web:
    container_name: !reset null
