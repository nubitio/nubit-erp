stages:
  - build
  - deploy

webpack_build:
  stage: build
  image: node:16.14.0
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - public/build

deploy_staging:
  stage: deploy
  image: registry.gitlab.com/compuexpress/efact:latest
  before_script:
    - apt update && apt install openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_HOST_KEY" > ~/.ssh/known_hosts
  script:
    - composer install
    - rsync -auzP --force --delete --progress --exclude-from=deploy_exclude.txt -e 'ssh -p22' ./ $DEPLOY_USERNAME@$DEPLOY_SERVER:/web/
  only:
    - master