[Date]
date.timezone = "UTC"

memory_limit = 256M

; Coverage is opt-in for CLI test runs (-d pcov.enabled=1). Leaving PCOV
; enabled in FrankenPHP's threaded server can corrupt the Zend heap.
pcov.enabled = 0

xdebug.client_host = host.docker.internal

; CVE-2026-109619 reuses per-request state via session upload progress.
; Nothing in this app reads it (no upload_progress / UPLOAD_IDENTIFIER).
session.upload_progress.enabled = 0
; PHP 8.5 includes backtraces in fatal errors by default. Keep paths and
; request data out of the error output.
fatal_error_backtraces = 0

; Size opcache like production. The defaults (10000 files / 128M) overflow once
; the app grows; the resulting "hash" restart crashes FrankenPHP ZTS with
; zend_mm_heap corrupted and the e2e stack never becomes ready.
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
