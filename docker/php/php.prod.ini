memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60
max_input_time = 60
date.timezone = "UTC"
expose_php = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.enable_file_override = 1
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php
; CVE-2026-109619 reuses per-request state via session upload progress.
; Nothing in this app reads it (no upload_progress / UPLOAD_IDENTIFIER).
session.upload_progress.enabled = 0
; PHP 8.5 includes backtraces in fatal errors by default. Keep paths and
; request data out of the error output.
fatal_error_backtraces = 0
