receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  otlphttp/signoz:
    endpoint: ${env:SIGNOZ_ENDPOINT}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/signoz]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/signoz]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/signoz]

  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
