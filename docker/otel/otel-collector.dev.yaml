receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  otlp/signoz:
    endpoint: ${env:SIGNOZ_ENDPOINT}
    tls:
      insecure: ${env:SIGNOZ_TLS_INSECURE}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
