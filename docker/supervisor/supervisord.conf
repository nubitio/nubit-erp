[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
user=www-data
stdout_logfile=/var/log/apache2/access.log
stderr_logfile=/var/log/apache2/error.log
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20

[program:messenger-consume]
command=php /var/www/html/bin/console messenger:consume scheduler_default --time-limit=3600
user=www-data
stdout_logfile=/var/log/messenger/consume.log
stderr_logfile=/var/log/messenger/consume_error.log
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20

[program:messenger-consume-async]
command=php /var/www/html/bin/console messenger:consume async --time-limit=3600
user=www-data
stdout_logfile=/var/log/messenger/consume_async.log
stderr_logfile=/var/log/messenger/consume_async_error.log
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
