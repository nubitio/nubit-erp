[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frankenphp]
command=frankenphp run --config /etc/caddy/Caddyfile
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20

[program:messenger-consume]
command=php /app/bin/console messenger:consume scheduler_default --time-limit=3600
user=www-data
stdout_logfile=/var/log/messenger/consume.log
stderr_logfile=/var/log/messenger/consume_error.log
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20

[program:messenger-consume-async]
command=php /app/bin/console messenger:consume async --time-limit=3600
user=www-data
stdout_logfile=/var/log/messenger/consume_async.log
stderr_logfile=/var/log/messenger/consume_async_error.log
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
