<div class="wrapper">
    <table id="salidas_dg"></table>
    <!-- Dialogo -->
    <div id="salidas_dlg">
        <div class="easyui-layout" data-options="fit:true">
            <form class="fm" id="salidas_fm" method="post" novalidate>
                <div data-options="region: 'north', border: false" style="height:180px; padding:10px 30px">
                    <div class="fitem">
                        <input id="salidas_fecha" name="fecha">
                    </div>
                    <div class="fitem">
                        <input id="salidas_operacion" name="operacion_id">
                    </div>
                    <div class="fitem">
                        <input id="salidas_almacen" name="almacen_id">
                    </div>
                    <div class="fitem">
                        <input id="salidas_glosa" name="glosa">
                    </div>
                </div>
                <div data-options="region: 'center'" style="padding:2px 0px">
                    <div class="easyui-layout" data-options="fit:true">
                        <div data-options="region: 'north', border: false" style="padding:0px 30px">
                            <table class="table table-bordered table-striped table-sm table-nomargin">
                                <tr>
                                    <th width="75%">Producto</th>
                                    <th width="20%">Cantidad</th>
                                    <th width="5%">
                                        <a href="#" onclick="app.salidas.add_detalle()">
                                            <i class="fa fa-plus fa-lg color-green"></i>
                                        </a>
                                    </th>
                                </tr>
                            </table>
                        </div>
                        <div data-options="region: 'center', border: false" style="padding:0px 30px">
                            <table class="table table-bordered table-striped table-sm table-nomargin">
                                <tbody id="salidas_tb_detalle"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script id="salidas_template" type="text/template">
    <tr id="salidas_tr_%position%">
        <td width="75%">
            <input id="salidas_cbproducto_%position%" name="detalle[producto][]">
        </td>
        <td width="20%">
            <input id="salidas_tbcantidad_%position%" name="detalle[cantidad][]" class="cantidad">
        </td>
        <td width="5%">
            <a href="#" onclick="app.salidas.remove_row(%position%)"><i class="fa fa-remove fa-lg color-red"
                                                                        style="padding:5px 3px"></i></a>
        </td>
    </tr>
</script>
<script src="{{ @ASSETS }}js/pages/salidas/index.js?v={{@version}}"></script>
