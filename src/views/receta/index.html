<div class="wrapper">
  <div class="row">
    <div class="col-md-12 full-row">
      <div id="receta_window">
        <table id="receta_dg"></table>
      </div>
      <!-- Dialogo -->
      <div id="receta_dlg">
        <div class="easyui-layout" data-options="fit:true">
          <form class="fm" id="receta_fm" method="post" novalidate>
            <div data-options="region: 'north', border: false" style="height:50px; padding:10px 30px">
              <div class="fitem">
                <input id="receta_nombre" name="producto_id">
              </div>
            </div>
            <div data-options="region: 'center'" style="padding:2px 0px">
              <div class="easyui-layout" data-options="fit:true">
                <div data-options="region: 'north', border: false" style="padding:0px 30px">
                  <table class="table table-bordered table-striped table-sm table-nomargin">
                    <tr>
                      <th width="75%">Insumo</th>
                      <th width="20%">Cantidad</th>
                      <th width="5%">
                        <a href="#" onclick="app.receta.add_detalle()">
                          <i class="fa fa-plus fa-lg color-green"></i>
                        </a>
                      </th>
                    </tr>
                  </table>
                </div>
                <div data-options="region: 'center', border: false" style="padding:0px 30px">
                  <table class="table table-bordered table-striped table-sm table-nomargin">
                    <tbody id="receta_tb_detalle"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script id="receta_template" type="text/template">
    <tr id="receta_tr_%position%">
      <td width="75%">
        <input id="receta_cbproducto_%position%" name="detalle[producto][]">
      </td>
      <td width="20%">
        <input id="receta_tbcantidad_%position%" name="detalle[cantidad][]" class="cantidad">
      </td>
      <td width="5%">
        <a href="#" onclick="app.receta.remove_row(%position%)"><i class="fa fa-remove fa-lg color-red"
                                                                   style="padding:5px 3px"></i></a>
      </td>
    </tr>
  </script>
  <script src="{{@UI}}receta/index.js?v={{@version}}"></script>
