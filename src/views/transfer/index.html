<div class="wrapper">
    <table id="transfer_dg"></table>
    <!-- Dialogo -->
    <div id="transfer_dlg">
        <div class="easyui-layout" data-options="fit:true">
            <form class="fm" id="transfer_fm" method="post" novalidate>
                <div data-options="region: 'north', border: false" style="height:185px; padding:10px 30px">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="fitem">
                                <input id="transfer_fecha" name="fecha">
                            </div>
                            <div class="fitem">
                                <input id="transfer_nota" name="nota">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="fitem">
                                <input id="transfer_almacen_origen" name="almacen_origen">
                            </div>
                            <div class="fitem">
                                <input id="transfer_almacen_destino" name="almacen_destino">
                            </div>
                        </div>
                    </div>
                </div>
                <div data-options="region: 'center', border: false" style="padding:0 30px">
                    <table class="table table-sm table-bordered header-fixed">
                        <thead class="thead-dark">
                        <tr>
                            <th style="width: 74%">Producto</th>
                            <th style="width: 20%">Cantidad</th>
                            <th style="width: 6%">
                                <a onclick="app.transfer.addDetail()" style="cursor: pointer">
                                    <i class="fas fa-plus text-success" style="padding: 3px"></i>
                                </a>
                            </th>
                        </tr>
                        </thead>
                        <tbody id="transfer_tb_detail" style="height: 110px"></tbody>
                    </table>
                </div>
            </form>
        </div>
    </div>
</div>
<script id="transfer_template" type="text/template">
    <tr id="transfer_tr_%position%">
        <td style="width: 74%">
            <input id="transfer_cbproducto_%position%" name="detalle[producto][]">
        </td>
        <td style="width: 20%">
            <input id="transfer_tbcantidad_%position%" name="detalle[cantidad][]" class="cantidad">
        </td>
        <td style="width: 6%">
            <a href="#" onclick="app.transfer.removeItem(%position%)">
                <i class="fas fa-times text-danger" style="padding: 6px"></i>
            </a>
        </td>
    </tr>
</script>
<script src="{{@UI}}transfer/index.js?v={{@version}}"></script>
