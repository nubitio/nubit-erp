services:
  web:
    container_name: efact-web
    restart: unless-stopped
    build:
      context: .
      target: dev
      args:
        PHP_VERSION: 8.5
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - '.:/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      SERVER_NAME: ":80"
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      QZ_CERT_PATH: "/app/var/qz/qz_cert.pem"
      QZ_PRIVATE_KEY_PATH: "/app/var/qz/qz_private.key"
      QZ_PRIVATE_KEY_PASSPHRASE: "Admin.3000"
      # Worker mode disabled for development (enable for performance testing)
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: "efact-dev"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_PROPAGATORS: "baggage,tracecontext"
      OTEL_TRACES_SAMPLER: "always_on"
      OTEL_LOG_LEVEL: "debug"
      OTEL_PHP_LOG_DESTINATION: "stderr"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config", "/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./docker/otel/otel-collector.dev.yaml:/etc/otelcol/otel-collector.yaml:ro
    environment:
      SIGNOZ_ENDPOINT: "https://ingest.nubit.io"
      SIGNOZ_TLS_INSECURE: "false"
    ports:
      - '4317:4317'
      - '4318:4318'

  database:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: efact
      MYSQL_USER: efact
      MYSQL_PASSWORD: Admin.3000
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
  vite:
    image: node:20.13.1
    #command: npm run watch
    working_dir: /home/node/app
    volumes:
      - '.:/home/node/app'
    stdin_open: true
    ports:
      - '5173:5173'
  redis:
    image: redis:6.2.6
    ports:
      - '6379:6379'

volumes:
  db-data:
