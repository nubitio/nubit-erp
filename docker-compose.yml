services:
  web:
    container_name: efact-web
    restart: unless-stopped
    security_opt:
      - label=disable
    build:
      context: .
      target: dev
      args:
        PHP_VERSION: 8.5
    ports:
      - '8080:80'
      - '8444:443'
    volumes:
      - '.:/app'
      - '../../nubit-symfony:/nubit-symfony'
      - 'app-var:/app/var'
      - 'app-public-uploads:/app/public/uploads'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      SERVER_NAME: ':80'
      APP_ENV: '${APP_ENV:-dev}'
      DATABASE_URL: '${DATABASE_URL:-mysql://demo:${MYSQL_PASSWORD:-changeme}@database:3306/demo?serverVersion=10.7.1-MariaDB&charset=utf8mb4}'
      CONTROL_PLANE_DATABASE_URL: '${CONTROL_PLANE_DATABASE_URL:-mysql://efact:${MYSQL_PASSWORD:-changeme}@database:3306/efact?serverVersion=10.7.1-MariaDB&charset=utf8mb4}'
      CADDY_GLOBAL_OPTIONS: 'auto_https off'
      QZ_CERT_PATH: '/app/var/qz/qz_cert.pem'
      QZ_PRIVATE_KEY_PATH: '/app/var/qz/qz_private.key'
      QZ_PRIVATE_KEY_PASSPHRASE: '${QZ_PRIVATE_KEY_PASSPHRASE:-changeme}'
      # Worker mode disabled for development (enable for performance testing)
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
      OTEL_PHP_AUTOLOAD_ENABLED: 'true'
      OTEL_SERVICE_NAME: 'efact-dev'
      OTEL_TRACES_EXPORTER: 'otlp'
      OTEL_LOGS_EXPORTER: 'otlp'
      OTEL_METRICS_EXPORTER: 'otlp'
      OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      OTEL_PROPAGATORS: 'baggage,tracecontext'
      OTEL_TRACES_SAMPLER: 'always_on'
      OTEL_LOG_LEVEL: 'debug'
      OTEL_PHP_LOG_DESTINATION: 'stderr'
      E2E_SEED_ENABLED: '1'
      AUTH_TOKEN_TTL: '${AUTH_TOKEN_TTL:-3600}'
      REFRESH_TOKEN_TTL: '${REFRESH_TOKEN_TTL:-604800}'
      APP_COOKIE_SECURE: 'false'
      DECOLECTA_TOKEN: '${DECOLECTA_TOKEN:-}'
      MAILER_FROM: '${MAILER_FROM:-noreply@efact.app}'
      ONBOARDING_DOMAIN: '${ONBOARDING_DOMAIN:-localhost}'
      DEFAULT_URI: '${DEFAULT_URI:-http://localhost:8080}'
      PAYPAL_CLIENT_ID: '${PAYPAL_CLIENT_ID:-}'
      PAYPAL_CLIENT_SECRET: '${PAYPAL_CLIENT_SECRET:-}'
      PAYPAL_WEBHOOK_ID: '${PAYPAL_WEBHOOK_ID:-}'
      PAYPAL_MODE: '${PAYPAL_MODE:-sandbox}'
      PAYPAL_PLAN_MAP: '${PAYPAL_PLAN_MAP:-{}}'
      MERCADOPAGO_ACCESS_TOKEN: '${MERCADOPAGO_ACCESS_TOKEN:-}'
      MERCADOPAGO_WEBHOOK_SECRET: '${MERCADOPAGO_WEBHOOK_SECRET:-}'
      MERCADOPAGO_PLAN_MAP: '${MERCADOPAGO_PLAN_MAP:-{}}'
      TZ: UTC
      # Mercure hub — proxy via Caddy (SLICE-014)
      MERCURE_URL: 'http://mercure/.well-known/mercure'
      MERCURE_PUBLIC_URL: '${MERCURE_PUBLIC_URL:-http://demo.localhost:8080/.well-known/mercure}'
      MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}'
      S3_ENDPOINT: '${S3_ENDPOINT:-http://minio:9000}'
      S3_PUBLIC_URL: '${S3_PUBLIC_URL:-}'
      S3_BUCKET_NAME: '${S3_BUCKET_NAME:-efact-dev}'
      S3_BUCKET_REGION: '${S3_BUCKET_REGION:-us-east-1}'
      S3_ACCESS_KEY: '${S3_ACCESS_KEY:-minioadmin}'
      S3_ACCESS_SECRET: '${S3_ACCESS_SECRET:-minioadmin}'
      S3_USE_PATH_STYLE_ENDPOINT: '${S3_USE_PATH_STYLE_ENDPOINT:-true}'
    depends_on:
      database:
        condition: service_started
      mercure:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.145.0
    user: '0:0'
    command: ['--config', '/etc/otelcol-contrib/config.yaml']
    configs:
      - source: otel_collector_dev_config
        target: /etc/otelcol-contrib/config.yaml
    environment:
      SIGNOZ_ENDPOINT: 'https://ingest.nubit.io'
      SIGNOZ_TLS_INSECURE: 'false'
    ports:
      - '4317:4317'
      - '4318:4318'

  database:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: efact
      MYSQL_USER: efact
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      TZ: UTC
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql

  messenger_worker:
    container_name: efact-messenger-worker
    restart: unless-stopped
    build:
      context: .
      target: dev
      args:
        PHP_VERSION: 8.5
    volumes:
      - '.:/app'
      - 'app-var:/app/var'
      - 'app-public-uploads:/app/public/uploads'
    environment:
      DATABASE_URL: '${DATABASE_URL:-mysql://demo:${MYSQL_PASSWORD:-changeme}@database:3306/demo?serverVersion=10.7.1-MariaDB&charset=utf8mb4}'
      CONTROL_PLANE_DATABASE_URL: '${CONTROL_PLANE_DATABASE_URL:-mysql://efact:${MYSQL_PASSWORD:-changeme}@database:3306/efact?serverVersion=10.7.1-MariaDB&charset=utf8mb4}'
      MERCURE_URL: 'http://mercure/.well-known/mercure'
      MERCURE_PUBLIC_URL: '${MERCURE_PUBLIC_URL:-http://demo.localhost:8080/.well-known/mercure}'
      MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}'
      MESSENGER_TRANSPORT_DSN: '${MESSENGER_TRANSPORT_DSN:-doctrine://control_plane?queue_name=default}'
      MAILER_FROM: '${MAILER_FROM:-noreply@efact.app}'
      OTEL_PHP_AUTOLOAD_ENABLED: 'false'
      E2E_SEED_ENABLED: '1'
      S3_ENDPOINT: '${S3_ENDPOINT:-http://minio:9000}'
      S3_PUBLIC_URL: '${S3_PUBLIC_URL:-}'
      S3_BUCKET_NAME: '${S3_BUCKET_NAME:-efact-dev}'
      S3_BUCKET_REGION: '${S3_BUCKET_REGION:-us-east-1}'
      S3_ACCESS_KEY: '${S3_ACCESS_KEY:-minioadmin}'
      S3_ACCESS_SECRET: '${S3_ACCESS_SECRET:-minioadmin}'
      S3_USE_PATH_STYLE_ENDPOINT: '${S3_USE_PATH_STYLE_ENDPOINT:-true}'
    depends_on:
      - database
      - mercure
      - minio
    command: php bin/console messenger:consume async --limit=1000 --memory-limit=256M -vv

  vite:
    image: node:20.19.0
    restart: unless-stopped
    security_opt:
      - label=disable
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # Required for yarn portal deps (@nubitio/crud → ../../nubit-react/...).
      NODE_OPTIONS: '--preserve-symlinks'
      # Host-visible Vite URL (mapped port below). Keeps efact off localhost:5173.
      VITE_DEV_SERVER_ORIGIN: 'http://localhost:5174'
    working_dir: /home/node/app
    command: >
      sh -lc "corepack enable && yarn dev --host 0.0.0.0"
    volumes:
      - '.:/home/node/app'
      # Linux-native deps — host node_modules (darwin) breaks Rollup inside the container.
      - vite-node-modules:/home/node/app/node_modules
      # Yarn portal: ../../nubit-react/packages/* resolves to /home/nubit-react/packages/*
      - '../../nubit-react:/home/nubit-react'
    ports:
      - '5174:5173'

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: creates the dev bucket on `docker compose up` and exits.
  # S3_BUCKET_NAME must match the app's S3_BUCKET_NAME (default: efact-dev).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-efact-dev} &&
      mc anonymous set download local/${S3_BUCKET_NAME:-efact-dev}
      "
    restart: 'no'

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    security_opt:
      - label=disable
    working_dir: /home/node/app
    # Bootstrap Corepack (Yarn 4) before every command, then run tests
    entrypoint: ['sh', '/home/node/app/docker/e2e-entrypoint.sh']
    command: ['npx', 'playwright', 'test']
    volumes:
      - '.:/home/node/app'
      - vite-node-modules:/home/node/app/node_modules
    environment:
      # Suppress Corepack download confirmation prompt
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # E2E_BASE_URL is resolved at runtime by docker/e2e-entrypoint.sh
      # Override here if you need a specific URL, e.g. E2E_BASE_URL=http://my-host
      E2E_BASE_URL: '${E2E_BASE_URL:-}'
      # Playwright needs this to run Chromium in a container (no sandbox)
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Tell the web container (and any helper scripts) that we are running in
      # the isolated test environment so the seed endpoint touches demo_test only.
      APP_ENV: 'test'
    depends_on:
      web:
        condition: service_healthy
      database:
        condition: service_started
    profiles:
      - e2e

  ###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      # Uncomment the following line to disable HTTPS,
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000 http://demo.localhost:8080 http://localhost:5173 http://localhost:5174 http://localhost:8080
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ['CMD', 'curl', '-f', 'https://localhost/healthz']
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  vite-node-modules:
  app-var:
  app-public-uploads:
  minio-data:

  ###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
  ###< symfony/mercure-bundle ###
  db-data:

configs:
  otel_collector_dev_config:
    file: ./docker/otel/otel-collector.dev.yaml
