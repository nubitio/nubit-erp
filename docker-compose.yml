services:
  web:
    container_name: web
    build: .
    ports:
      - '8080:80'
    volumes:
      - '.:/var/www/html'
  webpack:
    image: node:16.14.0
    #command: npm run watch
    working_dir: /home/node/app
    volumes:
      - '.:/home/node/app'
    stdin_open: true
  mercure:
    image: dunglas/mercure
    environment:
      - JWT_KEY=your_secret_key
      - ALLOW_ANONYMOUS=1
      - CORS_ALLOWED_ORIGINS=*
    ports:
      - '3000:80'
  vulcain:
    image: dunglas/vulcain
    environment:
      - VULCAIN_UPSTREAM=http://web:8080/api/v1
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
  redis:
    image: redis:6.2.6
    ports:
      - '6379:6379'
