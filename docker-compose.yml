version: '3.9'

services:
  web:
    container_name: efact-web
    build: .
    ports:
      - '8080:80'
    volumes:
      - '.:/var/www/html'
  webpack:
    image: node:16.14.0
    #command: npm run watch
    working_dir: /home/node/app
    volumes:
      - '.:/home/node/app'
    stdin_open: true
  redis:
    image: redis:6.2.6
    ports:
      - '6379:6379'
