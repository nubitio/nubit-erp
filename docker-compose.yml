services:
  web:
    container_name: efact-web
    restart: unless-stopped
    security_opt:
      - label=disable
    build:
      context: .
      target: dev
      args:
        PHP_VERSION: 8.5
    ports:
      - '8080:80'
      - '8444:443'
    volumes:
      - '.:/app'
      - 'app-var:/app/var'
      - 'app-public-uploads:/app/public/uploads'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      SERVER_NAME: ':80'
      DATABASE_URL: '${DATABASE_URL:-mysql://demo:${MYSQL_PASSWORD:-changeme}@database:3306/demo?serverVersion=10.7.1-MariaDB&charset=utf8mb4}'
      CONTROL_PLANE_DATABASE_URL: '${CONTROL_PLANE_DATABASE_URL:-mysql://efact:${MYSQL_PASSWORD:-changeme}@database:3306/efact?serverVersion=10.7.1-MariaDB&charset=utf8mb4}'
      CADDY_GLOBAL_OPTIONS: 'auto_https off'
      QZ_CERT_PATH: '/app/var/qz/qz_cert.pem'
      QZ_PRIVATE_KEY_PATH: '/app/var/qz/qz_private.key'
      QZ_PRIVATE_KEY_PASSPHRASE: '${QZ_PRIVATE_KEY_PASSPHRASE:-changeme}'
      # Worker mode disabled for development (enable for performance testing)
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
      OTEL_PHP_AUTOLOAD_ENABLED: 'true'
      OTEL_SERVICE_NAME: 'efact-dev'
      OTEL_TRACES_EXPORTER: 'otlp'
      OTEL_LOGS_EXPORTER: 'otlp'
      OTEL_METRICS_EXPORTER: 'otlp'
      OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      OTEL_PROPAGATORS: 'baggage,tracecontext'
      OTEL_TRACES_SAMPLER: 'always_on'
      OTEL_LOG_LEVEL: 'debug'
      OTEL_PHP_LOG_DESTINATION: 'stderr'
      E2E_SEED_ENABLED: '1'
      APP_COOKIE_SECURE: 'false'
      TZ: UTC
      # Mercure hub — proxy via Caddy (SLICE-014)
      MERCURE_URL: 'http://mercure/.well-known/mercure'
      MERCURE_PUBLIC_URL: '${MERCURE_PUBLIC_URL:-http://demo.localhost:8080/.well-known/mercure}'
      MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.145.0
    user: '0:0'
    command: ['--config', '/etc/otelcol-contrib/config.yaml']
    configs:
      - source: otel_collector_dev_config
        target: /etc/otelcol-contrib/config.yaml
    environment:
      SIGNOZ_ENDPOINT: 'https://ingest.nubit.io'
      SIGNOZ_TLS_INSECURE: 'false'
    ports:
      - '4317:4317'
      - '4318:4318'

  database:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: efact
      MYSQL_USER: efact
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      TZ: UTC
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql

  vite:
    image: node:20.19.0
    security_opt:
      - label=disable
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    #command: npm run watch
    working_dir: /home/node/app
    volumes:
      - '.:/home/node/app'
    stdin_open: true
    ports:
      - '5173:5173'

  redis:
    image: redis:6.2.6
    ports:
      - '6379:6379'

  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    security_opt:
      - label=disable
    working_dir: /home/node/app
    # Bootstrap Corepack (Yarn 4) before every command, then run tests
    entrypoint: ['sh', '/home/node/app/docker/e2e-entrypoint.sh']
    command: ['yarn', 'test:e2e']
    volumes:
      - '.:/home/node/app'
    environment:
      # Suppress Corepack download confirmation prompt
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # E2E_BASE_URL is resolved at runtime by docker/e2e-entrypoint.sh
      # Override here if you need a specific URL, e.g. E2E_BASE_URL=http://my-host
      E2E_BASE_URL: '${E2E_BASE_URL:-}'
      # Playwright needs this to run Chromium in a container (no sandbox)
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Tell the web container (and any helper scripts) that we are running in
      # the isolated test environment so the seed endpoint touches demo_test only.
      APP_ENV: 'test'
    depends_on:
      web:
        condition: service_healthy
      database:
        condition: service_started
    profiles:
      - e2e

  ###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      # Uncomment the following line to disable HTTPS,
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000 http://demo.localhost:8080 http://localhost:5173
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ['CMD', 'curl', '-f', 'https://localhost/healthz']
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  app-var:
  app-public-uploads:

  ###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
  ###< symfony/mercure-bundle ###
  db-data:

configs:
  otel_collector_dev_config:
    file: ./docker/otel/otel-collector.dev.yaml
