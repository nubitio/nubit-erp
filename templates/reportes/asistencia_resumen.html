<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.2/css/bootstrap.min.css"
          integrity="sha384-Smlep5jCw/wG7hdkwQ/Z5nLIefveQRIY9nfy6xoR1uRYBtpZgI6339F5dgvm/e9B" crossorigin="anonymous">

    <title>Reporte cobranza</title>
</head>
<body>

<div class="container">
    <h2 class="text-center">Reporte de prestamos colocados</h2>
    <hr>
    <div class="page-header">
        <h5>Agente: {{@agente}}</h5>
    </div>
    <table class="table table-striped table-bordered table-sm">
        <thead>
        <tr class="thead-dark">
            <th>#</th>
            <th>Prestamo</th>
            <th>Cliente</th>
            <th class="text-right">Total</th>
        </tr>
        </thead>
        <tbody>
        <repeat group="{{ @creditos }}" value="{{ @credito }}" counter="{{ @counter }}">
            <tr>
                <td>{{ @counter }}</td>
                <td>{{ @credito['prestamo'] }}</td>
                <td>{{ trim(@credito['cliente']) }}</td>
                <td class="text-right">{{ @credito['total'] }}</td>
            </tr>
        </repeat>
        </tbody>
        <tfoot>
        <tr class="table-secondary">
            <th colspan="3">Total</th>
            <th class="text-right">{{ @total }}</th>
        </tr>
        </tfoot>
    </table>
</div>

<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.2/js/bootstrap.min.js"
        integrity="sha384-o+RDsa0aLu++PJvFqy8fFScvbHFLtbvScb8AjopnFD+iEQ7wo/CG0xlczd+2O/em"
        crossorigin="anonymous"></script>
</body>
</html>
