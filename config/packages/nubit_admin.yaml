nubit_admin:
    auth:
        secret: '%env(APP_SECRET)%'
        access_token_ttl: '%env(int:AUTH_TOKEN_TTL)%'
        refresh_token_ttl: '%env(int:REFRESH_TOKEN_TTL)%'
        cookie_secure: '%env(bool:APP_COOKIE_SECURE)%'
    api:
        docs_locale: '%env(APP_API_LOCALE)%'
    # Media library on the existing S3 storage. directory keeps the legacy
    # object layout ({tenant}/images/... — the tenant prefix comes from the
    # FileManager). URLs resolve straight to S3/CDN via
    # App\Efact\Filesystem\S3MediaUrlResolver (aliased in services.yaml).
    media:
        enabled: true
        storage:
            filesystem: 'oneup_flysystem.default_filesystem_filesystem'
        directory: images
    # Audit trail: #[Auditable] entities (Supplier, Product) record
    # field-level diffs, served at /api/audit-trail/{resource}/{id}.
    audit:
        enabled: true
    # Full OpenTelemetry instrumentation supplied by Nubit: HTTP spans and
    # metrics, Doctrine spans, Messenger trace propagation, tenant context and
    # privacy-safe log/trace attribute redaction.
    observability:
        enabled: true
        redaction_hmac_key: '%env(APP_SECRET)%'
    # Collection exports remain opt-in per resource via #[Exportable].
    export:
        enabled: true
    # efact is multi-tenant: the ControlPlane services bound in services.yaml
    # implement the Nubit\Platform contracts, so skip the noop defaults.
    single_tenant_defaults: false
