nubit_admin:
    auth:
        secret: '%env(APP_SECRET)%'
        access_token_ttl: '%env(int:AUTH_TOKEN_TTL)%'
        refresh_token_ttl: '%env(int:REFRESH_TOKEN_TTL)%'
        cookie_secure: '%env(bool:APP_COOKIE_SECURE)%'
    api:
        docs_locale: '%env(APP_API_LOCALE)%'
    # Media library on the existing S3 storage. directory keeps the legacy
    # object layout ({tenant}/images/... — the tenant prefix comes from the
    # FileManager). URLs resolve straight to S3/CDN via
    # App\Efact\Filesystem\S3MediaUrlResolver (aliased in services.yaml).
    media:
        enabled: true
        storage:
            filesystem: 'oneup_flysystem.default_filesystem_filesystem'
        directory: images
        # Whoever edits something that carries an image: the company logo, a product photo, an expense
        # receipt. Without this any signed-in user could upload. Type and size are limited by the bundle
        # (images and PDF, 10 MB).
        upload_security: >-
            is_granted('perm:settings.edit')
            or is_granted('perm:catalog.create')
            or is_granted('perm:catalog.edit')
            or is_granted('perm:expense_reports.create')
    # Audit trail: #[Auditable] entities (Supplier, Product, PriceList) record
    # field-level diffs, served at /api/audit-trail/{resource}/{id}.
    audit:
        enabled: true
        # The history shows who changed what, with before and after (costs, prices, tax documents), so it
        # follows the permission that edits the thing. Anything not listed is refused.
        read_security: >-
          (subject['resource'] == 'product' and is_granted('perm:catalog.edit'))
          or (subject['resource'] == 'pricelist' and is_granted('perm:catalog.edit'))
          or (subject['resource'] == 'supplier' and is_granted('perm:purchases.edit'))
          or (subject['resource'] == 'purchase' and is_granted('perm:purchases.view'))
          or (subject['resource'] == 'stockentry' and is_granted('perm:inventory.adjust'))
          or (subject['resource'] == 'taxdocument' and is_granted('perm:sales.view'))
    # Full OpenTelemetry instrumentation supplied by Nubit: HTTP spans and
    # metrics, Doctrine spans, Messenger trace propagation, tenant context and
    # privacy-safe log/trace attribute redaction.
    observability:
        enabled: true
        redaction_hmac_key: '%env(APP_SECRET)%'
    # Collection exports remain opt-in per resource via #[Exportable].
    export:
        enabled: true
    # efact is multi-tenant: the ControlPlane services bound in services.yaml
    # implement the Nubit\Platform contracts, so skip the noop defaults.
    single_tenant_defaults: false
