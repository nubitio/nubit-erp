when@dev:
    pentatrion_vite:
        # The `vite` container announces itself to the browser as
        # http://localhost:5174 (VITE_DEV_SERVER_ORIGIN, see docker-compose.yml),
        # since that's the host-mapped port the browser can reach. But the
        # `web` container proxies dev asset requests server-side, and
        # "localhost:5174" from inside `web`'s own network namespace doesn't
        # resolve to the `vite` container. Override just the server-side proxy
        # target to the docker-compose service DNS name instead.
        proxy_origin: 'http://vite:5173'
