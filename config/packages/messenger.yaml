framework:
  messenger:
    # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
    failure_transport: failed

    transports:
      # https://symfony.com/doc/current/messenger.html#transport-configuration
      async:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        retry_strategy:
          max_retries: 3
          delay: 2000
          multiplier: 2
      failed: 'doctrine://control_plane?queue_name=failed'
      sync: 'sync://'

    routing:
      # Route your messages to the transports
      Symfony\Component\Mailer\Messenger\SendEmailMessage: async
      Symfony\Component\Notifier\Message\ChatMessage: async
      Symfony\Component\Notifier\Message\SmsMessage: async
      App\Efact\Audit\AuditLogMessage: async
      App\Billing\Message\SendInvoiceMessage: async
      App\Catalog\Message\ProductImportMessage: async
      # Mercure updates publish in the worker: a dead hub never blocks the
      # HTTP write and delivery gets the retry strategy. In the worker the
      # bundle FailSafeHub rethrows on failure so retries actually happen
      # (in HTTP context it would log-and-continue instead).
      Symfony\Component\Mercure\Update: async

