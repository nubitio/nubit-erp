doctrine:
  dbal:
    default_connection: tenant
    connections:
      tenant:
        wrapper_class: App\Efact\Doctrine\DBAL\TenantConnection
        url: '%env(resolve:DATABASE_URL)%'
        mapping_types:
          enum: string

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
      control_plane:
        url: '%env(resolve:CONTROL_PLANE_DATABASE_URL)%'
        mapping_types:
          enum: string
        profiling_collect_backtrace: '%kernel.debug%'
  orm:
    validate_xml_mapping: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    identity_generation_preferences:
      Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
    mappings:
      App:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/'
        prefix: 'App'
        alias: App
    controller_resolver: {}
    filters:
      branch_filter:
        class: App\Efact\Doctrine\Filter\BranchFilter
        enabled: false

when@test:
  doctrine:
    dbal:
      # dbname_suffix was removed: it's incompatible with url-based connection
      # config in this DoctrineBundle version — combining the two silently
      # drops host/dbname/password resolution entirely (falls back to
      # localhost with no dbname), rather than raising an error. The test DB
      # name is set explicitly via DATABASE_URL at invocation time instead
      # (see Makefile's EXEC_WEB_TEST / CI's "Create and migrate test database").

when@prod:
  doctrine:
    orm:
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system
