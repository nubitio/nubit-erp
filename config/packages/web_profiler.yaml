when@dev:
    web_profiler:
        # A presentation should never expose request timings, route names or
        # framework internals to a prospect. Enable it temporarily only while
        # diagnosing a request in this local development stack.
        toolbar:
            enabled: false

    framework:
        profiler:
            collect_serializer_data: true

when@test:
    framework:
        profiler:
            collect: false
            collect_serializer_data: true
