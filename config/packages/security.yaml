security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }
        control_plane_admin_provider:
            id: App\ControlPlane\Admin\Security\ControlPlaneUserProvider
        user_provider:
            id: App\Identity\Auth\UserProvider
    role_hierarchy:
        # Control-plane admin role hierarchy
        # ROLE_CP_VIEWER  → read-only access: dashboard, tenant list, audit log
        # ROLE_ADMIN      → normal operations: create/edit tenants, change plans, manage domains, provision, backup
        # ROLE_SUPER_ADMIN→ destructive actions (purge, restore from backup, delete backup) + future admin management
        ROLE_CP_VIEWER: ROLE_USER
        ROLE_ADMIN: [ ROLE_USER, ROLE_CP_VIEWER ]
        ROLE_SUPER_ADMIN: [ ROLE_USER, ROLE_CP_VIEWER, ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH ]
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api_docs:
            pattern: ^/api/docs
            security: false
        account_api:
            pattern: ^/api/account
            security: false
            stateless: false
        control_plane_api:
            pattern: ^/api/control-plane
            context: control_plane
            provider: control_plane_admin_provider
            stateless: false
            lazy: true
        admin:
            pattern: ^/admin
            context: control_plane
            provider: control_plane_admin_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                always_use_default_target_path: false
                username_parameter: username
                password_parameter: password
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: admin_logout
                target: admin_login
                invalidate_session: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800   # 7 días
                path: /admin
        # Machine-to-machine integration API. Must sit before `main` so
        # `^/api/v1` is claimed here and authenticated by the API key, not the
        # tenant JWT. The key names its own tenant (see ApiKeyAuthenticator).
        integration_api:
            pattern: ^/api/v1
            stateless: true
            provider: user_provider
            custom_authenticators:
                - App\Integration\Security\ApiKeyAuthenticator
            entry_point: App\Integration\Security\ApiKeyAuthenticator
        main:
            lazy: true
            stateless: true
            pattern: ^/api
            provider: user_provider
            custom_authenticator: Nubit\AdminBundle\Auth\JWTAuthenticator
            # Same mechanism as the admin firewall below: Symfony's built-in
            # login_throttling hooks CheckPassportEvent whenever the passport
            # carries a PasswordCredentials badge, which only happens on an
            # actual login attempt (JWTAuthenticator::authenticateWithCredentials).
            # JWT-bearer requests use SelfValidatingPassport and are unaffected —
            # this only throttles credential-guessing against /api/auth/login.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # Symfony's session-based switch_user doesn't fit this firewall
            # (stateless, JWT-per-request, per-tenant DB connection). Support
            # impersonation is instead a control-plane endpoint that mints a
            # scoped JWT for the target tenant user — see
            # App\ControlPlane\Operator\Api\ImpersonationApiController.

    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/account, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/account, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/webhook/paypal, roles: PUBLIC_ACCESS }
        - { path: ^/webhook/mercadopago, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/impersonate/consume, roles: PUBLIC_ACCESS }
        # E2E seed/reset routes — only registered in dev/test (config/routes/e2e.yaml),
        # so this rule is a no-op in prod (routes 404 before access_control is checked).
        - { path: '^/api/test/e2e/(seed|reset)', roles: PUBLIC_ACCESS }
        - { path: ^/api/v1, roles: ROLE_INTEGRATION }
        - { path: ^/api/settings, roles: ROLE_USER }
        - { path: ^/api/setup, roles: PUBLIC_ACCESS }
        - { path: ^/api/sales/report, roles: ROLE_USER }
        - { path: ^/receipt/[-\w ]+$, roles: PUBLIC_ACCESS }
        - { path: ^/receipt/[-\w ]+/(ticket|pdf|xml|cdr), roles: PUBLIC_ACCESS }
        - { path: ^/sale/consult, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/control-plane, roles: ROLE_CP_VIEWER }
        - { path: ^/admin/users, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin, roles: ROLE_CP_VIEWER }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
