# config/packages/ai.yaml
parameters:
    ai_model_chat_default: 'grok-4.3'

ai:
    platform:
        openai:
            api_key: '%env(default::OPENAI_API_KEY)%'

    agent:
        default:
            platform: 'ai.platform.assistant'
            model: '%env(default:ai_model_chat_default:AI_MODEL_CHAT)%'
            prompt:
                file: '%kernel.project_dir%/prompts/assistant.md'
                include_tools: true
