api_platform:
  title: 'Efact API'
  description: 'Efact API'
  version: '1.0.0'
  path_segment_name_generator: 'api_platform.metadata.path_segment_name_generator.dash'
  mapping:
    paths: [ '%kernel.project_dir%/src' ]
  formats:
    json: [ 'application/json' ]
    html: [ 'text/html' ]
  swagger:
    api_keys:
      JWT:
        name: Authorization
        type: header
