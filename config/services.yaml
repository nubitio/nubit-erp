# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  jwt_access_token_ttl: '%env(int:AUTH_TOKEN_TTL)%'
  jwt_refresh_token_ttl: '%env(int:REFRESH_TOKEN_TTL)%'
  tenant_rate_limit: '300'
  tenant_rate_window: '60'
  app.api_base_url: '%env(APP_API_BASE_URL)%'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      Psr\Log\LoggerInterface $billingLogger: '@monolog.logger.billing'

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Core\Security\Auth\JWTManager:
    arguments:
      $secret: '%env(APP_SECRET)%'
  App\Core\Security\Auth\TokenGeneratorService:
    arguments:
      $accessTokenTtl: '%jwt_access_token_ttl%'
      $refreshTokenTtl: '%jwt_refresh_token_ttl%'
  App\Core\Security\Auth\CookieFactoryService:
    arguments:
      $cookieSecure: '%env(bool:APP_COOKIE_SECURE)%'
  App\Core\Security\Auth\MercureSubscriberTokenService:
    arguments:
      $mercureJwtSecret: '%env(MERCURE_JWT_SECRET)%'
      $accessTokenTtl: '%jwt_access_token_ttl%'
  Aws\S3\S3Client:
    arguments:
      - version: 'latest'
        endpoint: '%env(S3_ENDPOINT)%'
        region: '%env(S3_BUCKET_REGION)%'
        credentials:
          key: '%env(S3_ACCESS_KEY)%'
          secret: '%env(S3_ACCESS_SECRET)%'

  App\Core\Service\TenantConnectionSwitcher:
    arguments:
      $connectionRegistry: '@doctrine'

  Doctrine\Persistence\ConnectionRegistry: '@doctrine'

  App\Core\Migrations\ControlPlaneMigrationFactory:
    arguments:
      $projectDir: '%kernel.project_dir%'

  doctrine.migrations.control_plane_dependency_factory:
    class: Doctrine\Migrations\DependencyFactory
    factory: ['@App\Core\Migrations\ControlPlaneMigrationFactory', 'createDependencyFactory']
    arguments:
      $logger: '@logger'

  App\Onboarding\Payment\PaymentGatewayInterface:
    class: App\Onboarding\Payment\PayPalGateway

  App\Onboarding\Payment\PayPalGateway:
    tags:
      - { name: app.payment_gateway }

  App\Onboarding\Payment\MercadoPagoGateway:
    tags:
      - { name: app.payment_gateway }

  App\Core\Logging\TenantLogProcessor:
    tags:
      - { name: monolog.processor }

  App\Core\Audit\AuditLogger: ~

  App\Core\Audit\AuditLogRepository: ~

  App\Inventory\Core\Contract\StockValidationPolicyInterface: '@App\Inventory\Core\Service\TenantStockValidationPolicy'
  App\Inventory\Core\Contract\UnitConversionServiceInterface: '@App\Inventory\Core\Service\UnitConversionService'
  App\AI\Context\BranchContextInterface: '@App\AI\Context\BranchContextAdapter'

  App\AI\Tool\ApiReadTool:
    arguments:
      $apiBaseUrl: '%app.api_base_url%'

  App\State\Mcp\ReadHydraResourceProcessor:
    arguments:
      $apiBaseUrl: '%app.api_base_url%'

  App\State\Mcp\InvokeHydraOperationProcessor:
    arguments:
      $apiBaseUrl: '%app.api_base_url%'

  App\State\Mcp\ApiDocsProvider:
    arguments:
      $apiBaseUrl: '%app.api_base_url%'

  Symfony\Component\Messenger\Middleware\DispatchAfterCurrentBusMiddleware:
    tags:
      - { name: messenger.middleware, bus: messenger.bus.default }

  App\Core\Messenger\TenantStampMiddleware:
    tags:
      - { name: messenger.middleware, bus: messenger.bus.default }

  App\Core\Messenger\TenantContextMiddleware:
    tags:
      - { name: messenger.middleware, bus: messenger.bus.default }

  # OpenTelemetry Logger Provider
  open_telemetry.logger_provider:
    class: OpenTelemetry\SDK\Logs\LoggerProviderInterface
    factory: ['OpenTelemetry\API\Globals', 'loggerProvider']

  # OpenTelemetry Monolog Handler
  open_telemetry.monolog.handler:
    class: OpenTelemetry\Contrib\Logs\Monolog\Handler
    arguments:
      $loggerProvider: '@open_telemetry.logger_provider'
      $level: !php/const Monolog\Level::Warning

  GuzzleHttp\ClientInterface:
    class: GuzzleHttp\Client

  App\ApiPlatform\TranslatedDocumentationNormalizer:
    decorates: api_platform.hydra.normalizer.documentation
    arguments:
      $inner: '@.inner'
      $translator: '@translator'
      $requestStack: '@request_stack'
      $apiLocale: '%env(APP_API_LOCALE)%'

  App\Infrastructure\Mercure\E2eTolerantHub:
    decorates: mercure.hub.default
    arguments:
      $inner: '@App\Infrastructure\Mercure\E2eTolerantHub.inner'
