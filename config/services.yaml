# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  jwt_access_token_ttl: '%env(int:AUTH_TOKEN_TTL)%'
  jwt_refresh_token_ttl: '%env(int:REFRESH_TOKEN_TTL)%'
  tenant_rate_limit: '300'
  tenant_rate_window: '60'
  app.api_base_url: '%env(APP_API_BASE_URL)%'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      Psr\Log\LoggerInterface $billingLogger: '@monolog.logger.billing'

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/Platform/'

  # Platform library — registered under Nubit\Platform\ namespace
  Nubit\Platform\:
    resource: '../src/Platform/'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Identity\Auth\JWTManager:
    arguments:
      $secret: '%env(APP_SECRET)%'
  App\Identity\Auth\TokenGeneratorService:
    arguments:
      $accessTokenTtl: '%jwt_access_token_ttl%'
      $refreshTokenTtl: '%jwt_refresh_token_ttl%'
  App\Identity\Auth\CookieFactoryService:
    arguments:
      $cookieSecure: '%env(bool:APP_COOKIE_SECURE)%'
  App\Identity\Auth\MercureSubscriberTokenService:
    arguments:
      $mercureJwtSecret: '%env(MERCURE_JWT_SECRET)%'
      $accessTokenTtl: '%jwt_access_token_ttl%'
  Aws\S3\S3Client:
    arguments:
      - version: 'latest'
        endpoint: '%env(S3_ENDPOINT)%'
        region: '%env(S3_BUCKET_REGION)%'
        credentials:
          key: '%env(S3_ACCESS_KEY)%'
          secret: '%env(S3_ACCESS_SECRET)%'

  App\ControlPlane\Tenant\Service\TenantConnectionSwitcher:
    arguments:
      $connectionRegistry: '@doctrine'

  Doctrine\Persistence\ConnectionRegistry: '@doctrine'

  App\Efact\Migrations\ControlPlaneMigrationFactory:
    arguments:
      $projectDir: '%kernel.project_dir%'

  doctrine.migrations.control_plane_dependency_factory:
    class: Doctrine\Migrations\DependencyFactory
    factory: ['@App\Efact\Migrations\ControlPlaneMigrationFactory', 'createDependencyFactory']
    arguments:
      $logger: '@logger'

  App\Billing\Sunat\Domain\LycetCompanyServiceInterface:
    class: App\Billing\Sunat\Infrastructure\LycetCompanyService

  # SPEC-004 transitional Platform boundary bindings:
  # ── Platform contracts → concrete implementations ─────────────────────────
  # Primary definitions are now on Nubit\Platform\... contracts.
  # App\Core\... shims remain as backward-compat aliases until removed.

  Nubit\Platform\Tenant\Contract\TenantRegistryInterface:
    class: App\ControlPlane\Tenant\Service\TenantManager

  App\Core\Platform\Tenant\TenantRegistryInterface:
    alias: Nubit\Platform\Tenant\Contract\TenantRegistryInterface

  Nubit\Platform\Tenant\Context\TenantContext:
    # Stateful per request/message; autoconfiguration creates a single instance.
    # App\Core\Context\TenantContext extends this, so both resolve to one object.
    class: Nubit\Platform\Tenant\Context\TenantContext

  App\Core\Context\TenantContext:
    alias: Nubit\Platform\Tenant\Context\TenantContext

  Nubit\Platform\Tenant\Contract\TenantConnectionSwitcherInterface:
    class: App\ControlPlane\Tenant\Service\TenantConnectionSwitcher

  App\Core\Platform\Tenant\TenantConnectionSwitcherInterface:
    alias: Nubit\Platform\Tenant\Contract\TenantConnectionSwitcherInterface

  Nubit\Platform\Tenant\Contract\TenantBackupRunnerInterface:
    class: App\ControlPlane\Tenant\Service\TenantBackupService

  App\Core\Platform\Tenant\TenantBackupRunnerInterface:
    alias: Nubit\Platform\Tenant\Contract\TenantBackupRunnerInterface

  Nubit\Platform\Quota\Contract\QuotaEnforcerInterface:
    class: App\ControlPlane\Billing\Service\TenantQuotaService

  App\Core\Platform\Billing\QuotaEnforcerInterface:
    alias: Nubit\Platform\Quota\Contract\QuotaEnforcerInterface

  # SPEC-005: Feature gate — bind the Platform contract to the ControlPlane implementation.
  Nubit\Platform\Feature\Contract\FeatureCheckerInterface:
    class: App\ControlPlane\Billing\Feature\TenantFeatureChecker
    arguments:
      $featureCache: '@cache.app.taggable'

  # SPEC-005 / TASK-034a: TenantManager needs the tag-aware cache to invalidate
  # per-tenant feature cache entries when a plan change occurs (AC-13).
  App\ControlPlane\Tenant\Service\TenantManager:
    arguments:
      $featureCache: '@cache.app.taggable'

  # SPEC-005 / TASK-034b: Override CRUD service — bind the tag-aware cache pool
  # so it can invalidate per-tenant feature cache entries (AC-14).
  App\ControlPlane\Billing\Feature\TenantFeatureOverrideManager:
    arguments:
      $featureCache: '@cache.app.taggable'

  # SPEC-005 / TASK-036: Reads #[RequiresFeature] attributes on controllers and
  # throws FeatureNotAvailableException (HTTP 402) when the tenant's plan does
  # not include the required feature.
  App\ControlPlane\Billing\Feature\FeatureKernelListener:
    tags:
      - { name: kernel.event_listener, event: kernel.controller, method: onKernelController }

  # SPEC-005 / TASK-037: Handles IS_GRANTED('FEATURE_*') expressions by
  # delegating to FeatureCheckerInterface::hasFeature(). The security.voter tag
  # is also applied automatically via autoconfigure, but is listed here
  # explicitly for clarity alongside the other SPEC-005 registrations.
  App\ControlPlane\Billing\Feature\FeatureVoter:
    tags:
      - { name: security.voter }

  Nubit\Platform\Quota\Contract\QuotaResourceResolverInterface:
    # Efact-owned adapter: maps concrete app entities to portable quota resource names.
    class: App\ControlPlane\Billing\Quota\EfactEntityQuotaResourceResolver

  App\ControlPlane\Tenant\Port\InitialTenantSetupPortInterface:
    class: App\ControlPlane\Tenant\Adapter\InitialSetupServiceAdapter

  App\ControlPlane\Tenant\Port\ElectronicBillingCompanyPortInterface:
    class: App\ControlPlane\Tenant\Adapter\LycetElectronicBillingCompanyAdapter

  App\ControlPlane\Certificate\CertificateLifecycleServiceInterface:
    class: App\ControlPlane\Certificate\CertificateLifecycleService

  App\ControlPlane\Certificate\CertificateAlertServiceInterface:
    class: App\ControlPlane\Certificate\CertificateAlertService

  App\Identity\Notification\UserNotificationServiceInterface:
    class: App\Identity\Notification\UserNotificationService

  App\ControlPlane\Certificate\TenantCertificateRepositoryInterface:
    class: App\ControlPlane\Certificate\TenantCertificateRepository

  App\ControlPlane\Subscription\Payment\PaymentGatewayInterface:
    class: App\ControlPlane\Subscription\Payment\PayPalGateway

  App\ControlPlane\Subscription\Payment\PayPalGateway:
    tags:
      - { name: app.payment_gateway }

  App\ControlPlane\Subscription\Payment\MercadoPagoGateway:
    tags:
      - { name: app.payment_gateway }

  Nubit\Platform\Observability\Logging\TenantLogProcessor:
    tags:
      - { name: monolog.processor }

  App\Core\Logging\TenantLogProcessor:
    alias: Nubit\Platform\Observability\Logging\TenantLogProcessor

  Nubit\Platform\Cache\CacheManager: ~

  App\Core\Cache\CacheManager:
    alias: Nubit\Platform\Cache\CacheManager

  Nubit\Platform\Filesystem\FileManager: ~

  App\Core\Filesystem\FileManager:
    alias: Nubit\Platform\Filesystem\FileManager

  App\Efact\Audit\AuditLogger: ~

  App\Efact\Audit\AuditLogRepository: ~

  App\Inventory\Core\Contract\SalesInventoryPortInterface: '@App\Inventory\Adapter\InventoryServiceSalesInventoryPort'
  App\Sales\Port\SaleInvoicingPortInterface: '@App\Billing\Adapter\SaleInvoicingAdapter'
  App\Inventory\Core\Contract\StockValidationPolicyInterface: '@App\Inventory\Core\Service\TenantStockValidationPolicy'
  App\Inventory\Core\Contract\UnitConversionServiceInterface: '@App\Inventory\Core\Service\UnitConversionService'
  App\AI\Context\BranchContextInterface: '@App\AI\Context\BranchContextAdapter'

  Symfony\Component\Messenger\Middleware\DispatchAfterCurrentBusMiddleware:
    tags:
      - { name: messenger.middleware, bus: messenger.bus.default }

  Nubit\Platform\Messenger\TenantStampMiddleware:
    tags:
      - { name: messenger.middleware, bus: messenger.bus.default }

  App\Core\Messenger\TenantStampMiddleware:
    alias: Nubit\Platform\Messenger\TenantStampMiddleware

  Nubit\Platform\Messenger\TenantContextMiddleware:
    tags:
      - { name: messenger.middleware, bus: messenger.bus.default }

  App\Core\Messenger\TenantContextMiddleware:
    alias: Nubit\Platform\Messenger\TenantContextMiddleware

  # OpenTelemetry Logger Provider
  open_telemetry.logger_provider:
    class: OpenTelemetry\SDK\Logs\LoggerProviderInterface
    factory: ['OpenTelemetry\API\Globals', 'loggerProvider']

  # OpenTelemetry Monolog Handler
  open_telemetry.monolog.handler:
    class: OpenTelemetry\Contrib\Logs\Monolog\Handler
    arguments:
      $loggerProvider: '@open_telemetry.logger_provider'
      $level: !php/const Monolog\Level::Warning

  GuzzleHttp\ClientInterface:
    class: GuzzleHttp\Client

  App\Efact\ApiPlatform\TranslatedDocumentationNormalizer:
    decorates: api_platform.hydra.normalizer.documentation
    arguments:
      $inner: '@.inner'
      $translator: '@translator'
      $requestStack: '@request_stack'
      $apiLocale: '%env(APP_API_LOCALE)%'

  App\Setup\Infrastructure\Mercure\E2eTolerantHub:
    decorates: mercure.hub.default
    arguments:
      $inner: '@App\Setup\Infrastructure\Mercure\E2eTolerantHub.inner'

  App\Billing\Sale\Void\SunatVoidService:
    arguments:
      $invoiceStrategy: '@App\Billing\Sale\Void\InvoiceVoidStrategy'
      $receiptStrategy: '@App\Billing\Sale\Void\ReceiptVoidStrategy'

  # ── Document Lookup (RUC / DNI) ────────────────────────────────────────────
  # Primario:  SUNAT scraping (gratis, sin token)
  # Fallback:  Decolecta API (https://decolecta.com) — requiere DECOLECTA_TOKEN
  # Cache:     Redis 7 días RUC / 30 días DNI
  App\Billing\Consult\Infrastructure\DecolectaClient:
    arguments:
      $decolectaToken: '%env(default::DECOLECTA_TOKEN)%'
