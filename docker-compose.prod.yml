services:
  web:
    image: ghcr.io/nubitio/efact:latest
    container_name: efact-web
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      # Application settings
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}

      # Database
      DATABASE_URL: ${DATABASE_URL}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Mailer
      MAILER_DSN: ${MAILER_DSN}

      # FrankenPHP settings
      SERVER_NAME: ${SERVER_NAME}
      FRANKENPHP_CONFIG: "worker ./public/index.php"

      # Caddy settings (remove auto_https off for production with valid domain)
      # CADDY_GLOBAL_OPTIONS: "auto_https off"

      # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-efact-prod}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-baggage,tracecontext}

      # AWS S3 (if used)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # Sentry (if used)
      SENTRY_DSN: ${SENTRY_DSN}

    volumes:
      - app-var:/app/var
      - app-public-uploads:/app/public/uploads

    networks:
      - default
      - nubit

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-var:
    driver: local
  app-public-uploads:
    driver: local

networks:
  default:
  nubit:
    external: true
