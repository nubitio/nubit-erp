services:
  web:
    image: {{IMAGE}}
    container_name: ${CONTAINER_NAME:-efact}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # Application settings
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}

      # Database
      DATABASE_URL: ${DATABASE_URL}

      # Redis
      REDIS_URL: ${REDIS_URL}

      # Mailer
      MAILER_DSN: ${MAILER_DSN}

      # Messenger
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}

      # FrankenPHP settings
      SERVER_NAME: ${SERVER_NAME}
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG}

      # Caddy settings (remove auto_https off for production with valid domain)
      # CADDY_GLOBAL_OPTIONS: "auto_https off"

      # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_PROPAGATORS: baggage,tracecontext

      # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # Sentry
      SENTRY_DSN:

    volumes:
      - app-var:/app/var
      - app-public-uploads:/app/public/uploads

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - shared_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker_async:
    image: {{IMAGE}}
    restart: unless-stopped
    depends_on:
      - web
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared_net
    command: >
      php /app/bin/console messenger:consume async
      --time-limit=3600
      --memory-limit=256M
      --no-interaction

  worker_scheduler:
    image: {{IMAGE}}
    restart: unless-stopped
    depends_on:
      - web
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared_net
    command: >
      php /app/bin/console messenger:consume scheduler_default
      --time-limit=3600
      --memory-limit=256M
      --no-interaction

volumes:
  app-var:
    driver: local
  app-public-uploads:
    driver: local

networks:
  default:
  shared_net:
    external: true
