services:
  web:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    container_name: ${CONTAINER_NAME:-efact}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # Application settings
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
      # Database
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL}
      # Redis
      REDIS_URL: ${REDIS_URL}
      # Mailer
      MAILER_DSN: ${MAILER_DSN}
      # Messenger
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      # FrankenPHP settings
      SERVER_NAME: ${SERVER_NAME}
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG}
      # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_PROPAGATORS: baggage,tracecontext
      # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # OPENAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # QZ Tray signing
      QZ_CERT_PATH: ${QZ_CERT_PATH:-/app/config/qz/qz_cert.pem}
      QZ_PRIVATE_KEY_PATH: ${QZ_PRIVATE_KEY_PATH:-/app/config/qz/qz_private.key}
      QZ_PRIVATE_KEY_PASSPHRASE: ${QZ_PRIVATE_KEY_PASSPHRASE}
      # Billing
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}

    volumes:
      - app-var:/app/var
      - app-public-uploads:/app/public/uploads
      - ./config/qz:/app/config/qz:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - shared_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker_async:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SKIP_MIGRATIONS: "true"
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
        # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_PROPAGATORS: baggage,tracecontext
        # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Billing
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared_net
    command: >
      php /app/bin/console messenger:consume async
      --time-limit=3600
      --memory-limit=256M
      --no-interaction

  worker_scheduler:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SKIP_MIGRATIONS: "true"
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
      REDIS_URL: ${REDIS_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
        # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_PROPAGATORS: baggage,tracecontext
        # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Billing
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared_net
    command: >
      php /app/bin/console messenger:consume scheduler_default
      --time-limit=3600
      --memory-limit=256M
      --no-interaction

volumes:
  app-var:
    driver: local
  app-public-uploads:
    driver: local

networks:
  default:
  shared_net:
    external: true
