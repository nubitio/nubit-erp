services:
  web:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    container_name: ${CONTAINER_NAME:-efact}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "80"
    environment:
      # Application settings
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1, ::1}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
      # Database
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL}
      PROVISIONING_DATABASE_URL: ${PROVISIONING_DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
      TENANT_DB_PASS: ${TENANT_DB_PASS}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Mailer
      MAILER_DSN: ${MAILER_DSN}
      # Messenger
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      # FrankenPHP settings
      SERVER_NAME: ${SERVER_NAME}
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG}
      # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_PROPAGATORS: baggage,tracecontext
      # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # OPENAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # QZ Tray signing
      QZ_CERT_PATH: ${QZ_CERT_PATH:-/app/var/qz/qz_cert.pem}
      QZ_PRIVATE_KEY_PATH: ${QZ_PRIVATE_KEY_PATH:-/app/var/qz/qz_private.key}
      QZ_PRIVATE_KEY_PASSPHRASE: ${QZ_PRIVATE_KEY_PASSPHRASE}
      # Billing
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}
    volumes:
      - app-var:/app/var
      - app-public-uploads:/app/public/uploads

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - shared

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker_async:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SKIP_MIGRATIONS: "true"
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL}
      PROVISIONING_DATABASE_URL: ${PROVISIONING_DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
      TENANT_DB_PASS: ${TENANT_DB_PASS}
      MAILER_DSN: ${MAILER_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
      # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_PROPAGATORS: baggage,tracecontext
      # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Billing
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared
    command: >
      php /app/bin/console messenger:consume async
      --time-limit=3600
      --memory-limit=256M
      --no-interaction
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit((int)!str_contains(file_get_contents('/proc/1/cmdline'), 'messenger:consume'));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker_scheduler:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SKIP_MIGRATIONS: "true"
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL}
      PROVISIONING_DATABASE_URL: ${PROVISIONING_DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
      TENANT_DB_PASS: ${TENANT_DB_PASS}
      MAILER_DSN: ${MAILER_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
      # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_PROPAGATORS: baggage,tracecontext
      # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # Billing
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared
    command: >
      php /app/bin/console messenger:consume scheduler_default
      --time-limit=3600
      --memory-limit=256M
      --no-interaction
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit((int)!str_contains(file_get_contents('/proc/1/cmdline'), 'messenger:consume'));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  database:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: efact
      MARIADB_USER: efact
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin=mariadb-bin
      --binlog-format=ROW
      --expire-logs-days=7
      --max-binlog-size=100M
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./scripts/setup-mariadb-users.sql:/docker-entrypoint-initdb.d/01-setup-users.sql:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-var:
    driver: local
  app-public-uploads:
    driver: local
  mariadb-data:
    driver: local
  redis-data:
    driver: local

networks:
  default:
  shared:
    external: true
