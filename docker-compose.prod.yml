# worker_async and worker_scheduler run the same image with the same
# environment (only S3_PUBLIC_URL differs) — shared here so the two don't
# drift when an env var is added/changed for one but not the other.
x-worker-env: &worker-env
  APP_ENV: ${APP_ENV:?set APP_ENV in .env.prod}
  APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env.prod}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
  CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL:?set CONTROL_PLANE_DATABASE_URL in .env.prod}
  PROVISIONING_DATABASE_URL: ${PROVISIONING_DATABASE_URL}
  BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
  TENANT_DB_PASS: ${TENANT_DB_PASS}
  MAILER_DSN: ${MAILER_DSN}
  MAILER_FROM: ${MAILER_FROM:-noreply@nubit.pe}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
  TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
  TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
  # OpenTelemetry
  OTEL_PHP_AUTOLOAD_ENABLED: true
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_PROPAGATORS: baggage,tracecontext
  # AWS S3
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
  S3_BUCKET_REGION: ${S3_BUCKET_REGION}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  # Billing
  BILL_API_BASE_URL: ${BILL_API_BASE_URL}
  BILL_API_TOKEN: ${BILL_API_TOKEN}
  # Mercure
  MERCURE_URL: 'http://mercure/.well-known/mercure'
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET in .env.prod}

services:
  # One-shot migration runner. Executes control-plane + tenant migrations
  # exactly once per deploy, before web/workers start. Kept out of the
  # web/worker entrypoints so scaling replicas or rolling restarts can never
  # race concurrent migration runs against the same database.
  migrate:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    restart: 'no'
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Migrations touch the Symfony container, which eagerly resolves every
      # env(...) referenced in config/*.yaml (mailer, mercure, messenger,
      # openai, ...) even for a console command — so this mirrors web's full
      # environment rather than a DB-only subset, to avoid compile-time
      # EnvNotFoundException failures.
      RUN_MIGRATIONS: 'true'
      APP_ENV: ${APP_ENV:?set APP_ENV in .env.prod}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env.prod}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1, ::1}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
      ONBOARDING_DOMAIN: ${ONBOARDING_DOMAIN:-nubit.pe}
      DEFAULT_URI: ${DEFAULT_URI:-https://nubit.pe}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_PLAN_MAP: ${PAYPAL_PLAN_MAP:-{}}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_PLAN_MAP: ${MERCADOPAGO_PLAN_MAP:-{}}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL:?set CONTROL_PLANE_DATABASE_URL in .env.prod}
      PROVISIONING_DATABASE_URL: ${PROVISIONING_DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
      TENANT_DB_PASS: ${TENANT_DB_PASS}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAILER_DSN: ${MAILER_DSN}
      MAILER_FROM: ${MAILER_FROM:-noreply@nubit.pe}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      OTEL_PHP_AUTOLOAD_ENABLED: false
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QZ_CERT_PATH: ${QZ_CERT_PATH:-/app/var/qz/qz_cert.pem}
      QZ_PRIVATE_KEY_PATH: ${QZ_PRIVATE_KEY_PATH:-/app/var/qz/qz_private.key}
      QZ_PRIVATE_KEY_PASSPHRASE: ${QZ_PRIVATE_KEY_PASSPHRASE}
      DECOLECTA_TOKEN: ${DECOLECTA_TOKEN:-}
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}
      MERCURE_URL: 'http://mercure/.well-known/mercure'
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?set MERCURE_PUBLIC_URL in .env.prod}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET in .env.prod}
    volumes:
      - app-var:/app/var
      - app-public-uploads:/app/public/uploads
    networks:
      - default
    command: ['php', '-r', 'exit(0);']
    mem_limit: 512m
    cpus: 1
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  web:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    container_name: ${CONTAINER_NAME:-efact}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    expose:
      - '80'
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 2
    environment:
      # Application settings
      APP_ENV: ${APP_ENV:?set APP_ENV in .env.prod}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env.prod}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1, ::1}
      TENANTS_CONFIG_PATH: ${TENANTS_CONFIG_PATH:-/app/var/tenants/tenants.yaml}
      TENANTS_SOURCE: ${TENANTS_SOURCE:-db}
      ONBOARDING_DOMAIN: ${ONBOARDING_DOMAIN:-nubit.pe}
      DEFAULT_URI: ${DEFAULT_URI:-https://nubit.pe}
      # Payment gateways (onboarding subscriptions)
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      PAYPAL_PLAN_MAP: ${PAYPAL_PLAN_MAP:-{}}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_PLAN_MAP: ${MERCADOPAGO_PLAN_MAP:-{}}
      # Database
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
      CONTROL_PLANE_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL:?set CONTROL_PLANE_DATABASE_URL in .env.prod}
      PROVISIONING_DATABASE_URL: ${PROVISIONING_DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL}
      TENANT_DB_PASS: ${TENANT_DB_PASS}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Mailer
      MAILER_DSN: ${MAILER_DSN}
      MAILER_FROM: ${MAILER_FROM:-noreply@nubit.pe}
      # Messenger
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      # FrankenPHP settings
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env.prod}
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-admin 0.0.0.0:2019}
      # OpenTelemetry
      OTEL_PHP_AUTOLOAD_ENABLED: true
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_PROPAGATORS: baggage,tracecontext
      # AWS S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # OPENAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # QZ Tray signing
      QZ_CERT_PATH: ${QZ_CERT_PATH:-/app/var/qz/qz_cert.pem}
      QZ_PRIVATE_KEY_PATH: ${QZ_PRIVATE_KEY_PATH:-/app/var/qz/qz_private.key}
      QZ_PRIVATE_KEY_PASSPHRASE: ${QZ_PRIVATE_KEY_PASSPHRASE}
      # Document lookup (RUC / DNI via SUNAT + decolecta.com)
      DECOLECTA_TOKEN: ${DECOLECTA_TOKEN:-}
      # Billing
      BILL_API_BASE_URL: ${BILL_API_BASE_URL}
      BILL_API_TOKEN: ${BILL_API_TOKEN}
      # Mercure hub — contenedor separado dunglas/mercure, proxiado por Caddy en /.well-known/mercure
      MERCURE_URL: 'http://mercure/.well-known/mercure'
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?set MERCURE_PUBLIC_URL in .env.prod}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?set MERCURE_JWT_SECRET in .env.prod}
    volumes:
      - app-var:/app/var
      - app-public-uploads:/app/public/uploads

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - default
      - shared

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  worker_async:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *worker-env
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared
    command: >
      php /app/bin/console messenger:consume async
      --time-limit=3600
      --memory-limit=256M
      --no-interaction
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          "exit((int)!str_contains(file_get_contents('/proc/1/cmdline'), 'messenger:consume'));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker_scheduler:
    image: ${IMAGE:-ghcr.io/nubitio/efact:latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *worker-env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - app-var:/app/var
    networks:
      - default
      - shared
    command: >
      php /app/bin/console messenger:consume scheduler_default
      --time-limit=3600
      --memory-limit=256M
      --no-interaction
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          "exit((int)!str_contains(file_get_contents('/proc/1/cmdline'), 'messenger:consume'));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
    command: /usr/bin/caddy run --config /etc/caddy/Caddyfile
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - default
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.145.0
    user: '0:0'
    restart: unless-stopped
    command: ['--config', '/etc/otelcol-contrib/config.yaml']
    volumes:
      - /opt/efact/otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      MYSQL_ENDPOINT: database:3306
      MYSQL_MONITORING_USER: efact_monitor
      MYSQL_MONITORING_PASSWORD: ${OTEL_MYSQL_MONITORING_PASSWORD}
      REDIS_ENDPOINT: redis:6379
      CADDY_METRICS_ENDPOINT: web:2019
      SIGNOZ_ENDPOINT: ${SIGNOZ_ENDPOINT:-https://ingest.nubit.io}
      SIGNOZ_TLS_INSECURE: ${SIGNOZ_TLS_INSECURE:-false}
      DEPLOYMENT_ENV: ${APP_ENV}
    mem_limit: 512m
    cpus: 1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:13133/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  database:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - '${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306'
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env.prod}
      MARIADB_DATABASE: efact
      MARIADB_USER: efact
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env.prod}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin=mariadb-bin
      # Tenant migrations run as the scoped application user. MariaDB
      # otherwise requires SUPER for CREATE TRIGGER while binary logging is
      # enabled, which blocks the cash_movements immutability migration.
      --log-bin-trust-function-creators=1
      --binlog-format=ROW
      --expire-logs-days=7
      --max-binlog-size=100M
      --slow-query-log=1
      --long-query-time=1
      --log-queries-not-using-indexes=0
      --performance-schema=ON
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    mem_limit: 768m
    cpus: 1
    volumes:
      - redis-data:/data
    networks:
      - default
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  app-var:
    driver: local
  app-public-uploads:
    driver: local
  mariadb-data:
    driver: local
  redis-data:
    driver: local
  mercure_data:
    driver: local
  mercure_config:
    driver: local

networks:
  default:
  shared:
    external: true
