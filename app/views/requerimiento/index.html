<div class="wrapper">
    <table id="requerimiento_dg"></table>
    <!-- Dialogo -->
    <div id="requerimiento_dlg">
        <div class="easyui-layout" data-options="fit:true">
            <form class="fm" id="requerimiento_fm" method="post" novalidate>
                <div data-options="region: 'north', border: false" style="height:230px; padding:10px 30px">
                    <div class="fitem">
                        <input id="requerimiento_fecha" name="fecha">
                    </div>
                    <div class="fitem">
                        <input id="requerimiento_almacen" name="almacen_id">
                    </div>
                    <div class="fitem">
                        <input id="requerimiento_plantilla" name="plantilla_id">
                    </div>
                </div>
                <div data-options="region: 'center', border: false" style="padding:0 30px">
                    <table class="table table-sm table-bordered header-fixed">
                        <thead class="thead-dark">
                        <tr>
                            <th style="width: 74%">Productoss</th>
                            <th style="width: 20%">Cantidad</th>
                            <th style="width: 6%">
                                <a onclick="app.requerimiento.add_detalle()" style="cursor: pointer">
                                    <i class="fas fa-plus text-success"></i>
                                </a>
                            </th>
                        </tr>
                        </thead>
                        <tbody id="requerimiento_tb_detalle" style="height: 110px"></tbody>
                    </table>
                </div>
            </form>
        </div>
    </div>
</div>
<script id="requerimiento_template" type="text/template">
    <tr id="requerimiento_tr_%position%">
        <td style="width: 74%">
            <input id="requerimiento_cbproducto_%position%" name="detalle[producto][]">
        </td>
        <td style="width: 20%">
            <input id="requerimiento_tbcantidad_%position%" name="detalle[cantidad][]" class="cantidad">
        </td>
        <td style="width: 6%">
            <a onclick="app.requerimiento.remove_row(%position%)" style="cursor: pointer">
                <i class="fas fa-times text-danger" style="padding: 6px"></i>
            </a>
        </td>
    </tr>
</script>
<script src="{{@UI}}requerimiento/index.js?v={{@version}}"></script>
